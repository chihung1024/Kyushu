/* Day diagnostics: quick trip health readout before the long timeline. */
.day-diagnostics-panel {
  margin: 0 0 1rem;
  padding: 1rem;
  border: 2px solid rgba(15, 23, 42, 0.08);
  border-radius: 1.25rem;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(239, 246, 255, 0.9));
  box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
}

.day-diagnostic-title {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-bottom: 0.75rem;
  color: #111827;
  font-size: 0.75rem;
  font-weight: 900;
  letter-spacing: 0.08em;
}

.day-diagnostic-chips {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.5rem;
}

.day-diagnostic-chip {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem;
  min-height: 2.5rem;
  padding: 0.55rem 0.7rem;
  border-radius: 0.9rem;
  border: 1px solid rgba(148, 163, 184, 0.35);
  background: #fff;
  color: #334155;
  font-size: 0.75rem;
  font-weight: 800;
}

.day-diagnostic-chip strong {
  color: #0f172a;
  font-size: 1rem;
  font-weight: 900;
}

.day-diagnostic-chip.must { border-color: #fecdd3; background: #fff1f2; color: #be123c; }
.day-diagnostic-chip.flex { border-color: #bae6fd; background: #f0f9ff; color: #0369a1; }
.day-diagnostic-chip.check { border-color: #fed7aa; background: #fff7ed; color: #c2410c; }
.day-diagnostic-chip.map { border-color: #bbf7d0; background: #f0fdf4; color: #15803d; }
.day-diagnostic-chip.muted { background: #f8fafc; color: #64748b; }

.day-diagnostic-cut {
  margin-top: 0.75rem;
  padding: 0.75rem;
  border-left: 4px solid #f97316;
  border-radius: 0.9rem;
  background: #fff7ed;
  color: #7c2d12;
  font-size: 0.8rem;
  line-height: 1.55;
}

.day-diagnostic-cut span {
  display: block;
  margin-bottom: 0.2rem;
  font-size: 0.7rem;
  font-weight: 900;
  letter-spacing: 0.06em;
}

.day-diagnostic-cut strong {
  font-weight: 900;
}

@media (min-width: 640px) {
  .day-diagnostic-chips {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

/* print-paper-guide-v5: formal A4 travel manual. */
@media print {
  @page {
    size: A4 portrait;
    margin: 10mm 10mm 13mm;
  }

  html,
  body {
    width: auto !important;
    min-height: auto !important;
    overflow: visible !important;
  }

  body {
    padding: 0 !important;
    background: #fff !important;
    background-image: none !important;
    color: #111827 !important;
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', Arial, sans-serif !important;
    font-size: 8.8pt !important;
    line-height: 1.42 !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  body > .print\:hidden,
  body > div.print\:hidden,
  .print\:hidden {
    display: none !important;
  }

  #print-container {
    display: block !important;
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;

<script data-source="js/utils/html.js">
// Shared HTML safety and text conversion helpers.
// Keep this file dependency-free because it is loaded as a plain browser script
// and also evaluated inside Node smoke tests.

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeAttr(value) {
  return escapeHtml(value);
}

function decodeBasicHtmlEntities(value) {
  return String(value ?? '')
    .replace(/&nbsp;/gi, ' ')
    .replace(/&amp;/gi, '&')
    .replace(/&lt;/gi, '<')
    .replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"')
    .replace(/&#39;/gi, "'")
    .replace(/&apos;/gi, "'");
}

function htmlToPlainText(html) {
  return decodeBasicHtmlEntities(
    String(html ?? '')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/\s*(p|div|li|tr|h[1-6])\s*>/gi, '\n')
      .replace(/<\s*li(?:\s[^>]*)?>/gi, '• ')
      .replace(/<[^>]*>/g, '')
  )
    .replace(/\r\n/g, '\n')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n[ \t]+/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function safeExternalUrl(value, fallback = '#') {
  const url = String(value ?? '').trim();
  if (/^https:\/\//i.test(url) || /^http:\/\//i.test(url)) return url;
  return fallback;
}

<script data-source="js/components/parking-buttons.js">
// Parking navigation button render helpers.

// 九州親子大冒險 - reusable render helpers and UI components

function getParkingButtonLabel(query) {
            if (!query) return '停車場導航';
            const key = String(query).trim();
            if (parkingLabelLookup[key]) return parkingLabelLookup[key];
            const cleaned = key
                .replace(/熊本市中央区新市街8-7/g, '')
                .replace(/\s*(駐車場|停車場)\s*$/g, '')
                .replace(/\s+/g, ' ')
                .trim();
            return `${cleaned || '目的地'}停車場導航`;
        }

        function parkingButtonHtml(query, label = null) {
            if (!query) return '';
            const buttonLabel = label || getParkingButtonLabel(query);
            return `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}" target="_blank" rel="noopener noreferrer" class="nav-pill parking-nav-pill inline-flex items-center gap-2 bg-white text-blue-700 border-2 border-blue-200 text-xs md:text-sm font-bold px-4 py-2 rounded-full shadow-sm hover:scale-105 transition"><span>🅿️</span> ${buttonLabel}</a>`;
        }

        function renderParkingButtons(parkingInfo) {
            if (!parkingInfo) return '';
            const items = Array.isArray(parkingInfo) ? parkingInfo : [parkingInfo];
            return items.map(item => {
                if (!item) return '';
                if (typeof item === 'string') return parkingButtonHtml(item);
                return parkingButtonHtml(item.query, item.label);
            }).join('');
        }

</script>
<script data-source="js/components/daily-gourmet.js">
// Daily gourmet section render helpers.

function escapeDailyGourmetHtml(value) {
            return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function renderDailyGourmet(day) {
            const data = dayGourmetDB[day];
            if (!data || !data.categories || !data.categories.length) return '';
            const rules = (data.rules || []).map(rule => `<span class="daily-gourmet-rule">${escapeDailyGourmetHtml(rule)}</span>`).join('');
            const categories = data.categories.map((category) => {
                const items = category.items || [];
                const cards = items.map(item => {
                    const rank = item.rank || 'B';
                    const query = item.mapQuery || item.name;
                    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
                    const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query + ' 営業時間 定休日 メニュー 予約')}`;
                    const caution = item.caution ? `<div class="daily-gourmet-card-section"><div class="daily-gourmet-label">注意</div><div class="daily-gourmet-text">${escapeDailyGourmetHtml(item.caution)}</div></div>` : '';
                    return `<article class="daily-gourmet-card gourmet-${String(rank).toLowerCase()}">
                        <div class="daily-gourmet-card-head">
                            <span class="daily-gourmet-rank rank-${escapeDailyGourmetHtml(rank)}">${escapeDailyGourmetHtml(rank)}</span>
                            <div class="min-w-0">
                                <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="daily-gourmet-name">${escapeDailyGourmetHtml(item.name)}</a>
                                <div class="daily-gourmet-meta">
                                    <span class="daily-gourmet-chip meal">${escapeDailyGourmetHtml(item.meal)}</span>

                        <div class="daily-gourmet-card-section"><div class="daily-gourmet-label">必點／主軸</div><div class="daily-gourmet-text"><strong>${escapeDailyGourmetHtml(item.order)}</strong></div></div>

                    </article>`;
                }).join('');
                return `<details class="daily-gourmet-category">
                    <summary>
                        <span class="daily-gourmet-category-icon">${escapeDailyGourmetHtml(category.icon)}</span>
                        <span class="flex-1 min-w-0">
                            <span class="daily-gourmet-category-title">${escapeDailyGourmetHtml(category.title)}</span>

            return `<section class="daily-gourmet-panel" id="day-gourmet-${day}">

                <div class="daily-gourmet-alert">S＝主動排；A＝順路優先；B＝備案／願望清單；C＝當天不建議硬追。帶小孩同行時，生牡蠣、生魚片、牛肉生食都採保守原則；燒肉由成人烤熟後再分食。</div>

<script data-source="js/components/backup-list.js">
// Backup spot and gourmet list renderers.

function normalizeBackupEntry(item) {
                if (!item) return { title: '', desc: '', starred: false };
                if (typeof item === 'object') {
                    const title = String(item.title || item.name || '').trim();
                    return {
                        title,
                        desc: String(item.desc || item.description || '').trim(),
                        starred: Boolean(item.starred || item.rank === 'S' || /^⭐/.test(title)),
                        mapQuery: item.mapQuery || title,
                    };
                }
                const raw = String(item);
                const separatorIndex = raw.indexOf('|');
                const rawTitle = separatorIndex >= 0 ? raw.slice(0, separatorIndex) : raw;
                const desc = separatorIndex >= 0 ? raw.slice(separatorIndex + 1) : '';
                const starred = rawTitle.includes('⭐');
                const title = rawTitle.replace('⭐', '').trim();
                return { title, desc: desc.trim(), starred, mapQuery: title };
            }

                        </div>

                        <div class="gourmet-section"><div class="gourmet-label">為什麼值得</div><div class="gourmet-text">${escapeHtml(item.why)}</div></div>

                        <div class="gourmet-actions">
                            <a href="${escapeAttr(mapUrl)}" target="_blank" rel="noopener noreferrer" class="gourmet-action">📍 導航</a>
                            <a href="${escapeAttr(searchUrl)}" target="_blank" rel="noopener noreferrer" class="gourmet-action secondary">⏱️ 查營業</a>
                            ${links}
                        </div>
                    </article>`;
                });

                html += `</div></div>`;
                container.innerHTML = html;
            }

function renderBackupList(container, currentBackupRegion, currentBackupCategory) {
                if (!container) return;
                if (currentBackupCategory === 'food') {
                    renderGourmetBackupList(container, currentBackupRegion);
                    return;
                }
                const dataList = backupDB[currentBackupRegion]?.[currentBackupCategory] || [];
                const styles = { sight: { border: 'border-blue-100' }, food: { border: 'border-orange-100' }, shop: { border: 'border-purple-100' } };
                const s = styles[currentBackupCategory] || { border: 'border-gray-100' };

                if (!dataList.length) {
                    container.innerHTML = `<div class="bg-gray-50 border-2 border-gray-200 rounded-2xl p-4 font-bold text-gray-700">目前沒有符合的備案資料。</div>`;
                    return;
                }

                let html = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pb-2 animate-[fadeIn_0.3s_ease-out]">`;
                dataList.forEach((item, index) => {
                    const entry = normalizeBackupEntry(item);
                    const cleanTitle = entry.title || '未命名備案';
                    const desc = entry.desc || '尚未填寫說明。';
                    const cardHighlightClass = entry.starred ? 'border-yellow-400 bg-yellow-50/50 ring-2 ring-yellow-400/50' : s.border;
                    const starIcon = entry.starred ? '<span class="text-yellow-500 mr-1 animate-pulse">⭐</span>' : '';

                    let badgeClass = 'rank-other';
                    if (index === 0) badgeClass = 'rank-1';
                    else if (index === 1) badgeClass = 'rank-2';
                    else if (index === 2) badgeClass = 'rank-3';

                    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(entry.mapQuery || cleanTitle)}`;
                    html += `<div class="${BACKUP_CARD_BASE_CLASS} ${cardHighlightClass}"><span class="rank-badge ${badgeClass} text-[10px] w-6 h-6 flex-shrink-0">${index + 1}</span><div><h5 class="font-bold text-sm md:text-base leading-tight">${starIcon}<a href="${escapeAttr(mapUrl)}" target="_blank" rel="noopener noreferrer" class="text-gray-800 hover:text-cyan-600 underline decoration-gray-400/50 underline-offset-2 transition-colors cursor-pointer py-1 block sm:inline">${escapeHtml(cleanTitle)}</a></h5><p class="text-[11px] md:text-xs text-gray-600 mt-1.5 leading-relaxed">${escapeHtml(desc)}</p></div></div>`;
                });
                html += `</div>`;
                container.innerHTML = html;
            }

                    titleEl.innerHTML = `<span>📝</span> Day ${day} 防呆清單`;

                    body = `<div class="grid grid-cols-1 gap-2">
                        ${(data.checklist || []).map(item => `

                                <input type="checkbox" class="w-6 h-6 mt-0.5 rounded border-gray-300 text-kawaii-pink focus:ring-kawaii-pink cursor-pointer shrink-0">
                                <span class="font-bold text-gray-800 leading-relaxed">${stripTags(item)}</span>

                    body = renderDailyGourmet(day) || `<div class="bg-gray-50 border-2 border-gray-200 rounded-2xl p-4 font-bold text-gray-700">本日沒有美食候選資料。</div>`;

<script data-source="js/components/print-view.js">
// Print-friendly paper travel manual renderer.
// The browser app remains interactive; this renderer builds a dedicated A4 guide
// for print/PDF export when window.print() is invoked.

function renderPrintViewHtml() {
    const normalizePrintText = (value) => String(value || '')
        .replace(/[\x00-\x1f\x7f]/g, ' ')
        .replace(/[\uFE0E\uFE0F]/g, '')
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
        .replace(/\s+/g, ' ')
        .replace(/\s*([，。；：、！？])\s*/g, '$1')
        .trim();

    const removePrintActionBlocks = (html) => String(html || '')
        .replace(/<button[\s\S]*?<\/button>/gi, '')
        .replace(/<div\s+class=["'][^"']*(?:flex|gap-2|mt-3)[^"']*["'][^>]*>[\s\S]*?<\/div>/gi, '')
        .replace(/<a\b[^>]*>([\s\S]*?)<\/a>/gi, '$1');

    const plainText = (value) => normalizePrintText(htmlToPlainText(removePrintActionBlocks(value)));
    const plain = (value) => escapeHtml(plainText(value));
    const inline = (value) => plain(value).replace(/\n+/g, ' / ');
    const stripTitlePrefix = (value) => plainText(value).replace(/^Day\s*\d+\s*[｜|]\s*/i, '').trim();
    const splitText = (value) => String(value || '')
        .split(/[｜|]/)
        .map(part => normalizePrintText(part))
        .filter(Boolean);

    const compactRows = (items) => (items || [])
        .map(item => `<div class="print-check-row"><span class="print-box">□</span><span>${escapeHtml(normalizePrintText(item))}</span></div>`)
        .join('');

    const simpleList = (items) => `<ul class="print-simple-list">${(items || [])
        .map(item => `<li>${escapeHtml(normalizePrintText(item))}</li>`)
        .join('')}</ul>`;

    const miniStat = (label, value) => `<div class="print-stat"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;

    const getParkingQueries = (mapQuery) => {
        const raw = parkingLookup && parkingLookup[mapQuery];
        if (!raw) return [];
        return Array.isArray(raw) ? raw : [raw];
    };

    const getParkingLabel = (query) => normalizePrintText((parkingLabelLookup && parkingLabelLookup[query]) || query);

    const allRegularSections = itineraryData.flatMap(day => (day.sections || [])
        .filter(sec => sec.type !== 'rain' && sec.time !== '彈性方案')
        .map(sec => ({ day: day.day, date: day.date, ...sec })));

    const uniqueParkingRows = [];
    const seenParking = new Set();
    itineraryData.forEach(day => {
        (day.sections || []).forEach(sec => {
            const queries = getParkingQueries(sec.mapQuery);
            queries.forEach(query => {
                const key = `${day.day}|${query}`;
                if (seenParking.has(key)) return;
                seenParking.add(key);
                uniqueParkingRows.push({
                    day: day.day,
                    scene: stripTitlePrefix(sec.title || sec.mapQuery || ''),
                    query: normalizePrintText(query),
                    label: getParkingLabel(query)
                });
            });
        });
    });

    const getTopDailyGourmetItems = (day, limit = 5) => {
        const source = dayGourmetDB && dayGourmetDB[String(day)];
        if (!source || !Array.isArray(source.categories)) return [];
        const items = [];
        source.categories.forEach(category => {
            (category.items || []).forEach(item => {
                items.push({
                    category: normalizePrintText(category.title),
                    name: normalizePrintText(item.name),
                    rank: normalizePrintText(item.rank || ''),
                    meal: normalizePrintText(item.meal || ''),
                    area: normalizePrintText(item.area || ''),
                    order: normalizePrintText(item.order || item.must || ''),
                    note: normalizePrintText(item.note || item.fit || ''),
                    caution: normalizePrintText(item.caution || '')
                });
            });
        });
        const score = { S: 4, A: 3, B: 2, C: 1 };
        return items
            .sort((a, b) => (score[b.rank] || 0) - (score[a.rank] || 0))
            .slice(0, limit);
    };

    const parseBackupEntry = (entry) => {
        const parts = splitText(entry);
        const name = normalizePrintText((parts[0] || '').replace(/^⭐\s*/, ''));
        return { name, desc: normalizePrintText(parts.slice(1).join('｜')) };
    };

    const topBackupItems = (region, category, limit = 8) => {
        const list = backupDB && backupDB[region] && backupDB[region][category];
        return (list || [])
            .slice(0, limit)
            .map(parseBackupEntry)
            .filter(item => item.name);
    };

    const topGourmetBackupItems = (region, limit = 12) => {
        const source = (gourmetBackupDB && gourmetBackupDB[region]) || [];
        const score = { S: 4, A: 3, B: 2, C: 1 };
        return source
            .slice()
            .sort((a, b) => (score[b.rank] || 0) - (score[a.rank] || 0))
            .slice(0, limit)

    const manualUseRules = [

        const focusHtml = focus ? `<section class="print-focus-grid">

            <div class="print-focus-card"><span>成功標準</span><strong>${plain(focus.win)}</strong></div>
            <div class="print-focus-card"><span>硬切時間</span><strong>${plain(focus.hardCut)}</strong></div>
            <div class="print-focus-card"><span>最大風險</span><strong>${plain(focus.risk)}</strong></div>
        </section>` : '';

        const priorityHtml = focus && Array.isArray(focus.priority) ? `
            <section class="print-block print-priority-block">
                <h3>優先順序 / 現場決策</h3>
                <div class="print-compact-grid">
                    <div>${simpleList(focus.priority)}</div>
                    <div><strong>決策原則</strong><p>${plain(focus.decision)}</p></div>
                </div>
            </section>` : '';

        const checklistHtml = (data.checklist || []).length ? `
            <section class="print-block print-checklist-block">
                <h3>出發前防呆清單</h3>
                <div class="print-check-grid">${compactRows(data.checklist || [])}</div>
            </section>` : '';

        const sectionHtml = regularSections.map(sec => {
            const cleanContent = plain(sec.content);
            const cleanTip = sec.deepTip ? plain(sec.deepTip) : '';
            const time = sec.time ? escapeHtml(normalizePrintText(sec.time)) : '彈性';
            const parkingQueries = getParkingQueries(sec.mapQuery);
            const parkingText = parkingQueries.length
                ? `<div class="print-mini-note"><span>停車/導航搜尋</span>${parkingQueries.map(q => `${getParkingLabel(q)}：${normalizePrintText(q)}`).map(escapeHtml).join('；')}</div>`
                : '';
            return `<section class="print-step">
                <div class="print-step-time">${time}</div>
                <div class="print-step-main">
                    <h4>${inline(sec.title)}</h4>
                    <p>${cleanContent}</p>
                    ${parkingText}
                    ${cleanTip ? `<div class="print-tip"><span>補充</span>${cleanTip}</div>` : ''}
                </div>
            </section>`;
        }).join('');

        const mealHtml = dailyMeals.length ? `<section class="print-block print-meal-block">
            <h3>今日用餐候選</h3>
            <table class="print-table print-meal-table">

                    <tr>
                        <td>${escapeHtml(item.rank || '-')}</td>
                        <td><strong>${escapeHtml(item.name)}</strong><br><span>${escapeHtml(item.category)}</span></td>
                        <td>${escapeHtml([item.area, item.meal].filter(Boolean).join(' / '))}</td>
                        <td>${escapeHtml([item.order, item.note, item.caution].filter(Boolean).join('；'))}</td>
                    </tr>`).join('')}</tbody>
            </table>
        </section>` : '';

        const flexHtml = flexSections.length ? `<section class="print-block print-flex-block">
            <h3>彈性 / 備案</h3>
            ${flexSections.map(sec => `<div class="print-flex-item"><strong>${inline(sec.title)}</strong><span>${plain(sec.content)}</span></div>`).join('')}
        </section>` : '';

        html += `<article class="print-day print-page">
            <header class="print-day-header">
                <div class="print-day-kicker">${escapeHtml(data.date)}・${inline(data.weather || '')}</div>
                <div class="print-day-title-row">
                    <h2>Day ${escapeHtml(data.day)}</h2>
                    <strong>${escapeHtml(stripTitlePrefix(data.title))}</strong>
                </div>
                <div class="print-meta-grid">
                    <div><span>動線</span>${inline(data.route)}</div>
                    <div><span>住宿</span>${inline(data.hotel)}</div>
                </div>
                ${focusHtml}
            </header>
            ${priorityHtml}
            ${checklistHtml}
            <section class="print-block print-timeline">
                <h3>當日時間軸</h3>
                ${sectionHtml}
            </section>
            ${mealHtml}
            ${flexHtml}
            ${data.tips ? `<section class="print-warning"><strong>注意事項</strong>${inline(data.tips)}</section>` : ''}

    const parkingRows = uniqueParkingRows.map(row => `
        <tr>
            <td>Day ${escapeHtml(row.day)}</td>
            <td>${escapeHtml(row.scene)}</td>
            <td>${escapeHtml(row.label)}</td>
            <td>${escapeHtml(row.query)}</td>
        </tr>`).join('');

    const backupSection = (region, title) => `
        <section class="print-manual-page print-page">
            <h2>${escapeHtml(title)}備案索引</h2>
            <div class="print-three-col">
                ${['sight', 'food', 'shop'].map(category => {
                    const label = category === 'sight' ? '景點' : category === 'food' ? '一般美食' : '購物/補給';
                    return `<section class="print-card">
                        <h3>${label}</h3>
                        ${topBackupItems(region, category, 8).map(item => `
                            <div class="print-backup-line"><strong>${escapeHtml(item.name)}</strong><p>${escapeHtml(item.desc)}</p></div>`).join('')}
                    </section>`;
                }).join('')}
            </div>
            <section class="print-card print-gourmet-index">
                <h3>${escapeHtml(title)}精選餐廳備案</h3>
                <table class="print-table">
                    <thead><tr><th>級</th><th>店名</th><th>類型/適合日</th><th>必點與策略</th></tr></thead>
                    <tbody>${topGourmetBackupItems(region, 12).map(item => `
                        <tr>
                            <td>${escapeHtml(item.rank)}</td>
                            <td><strong>${escapeHtml(item.name)}</strong></td>
                            <td>${escapeHtml([item.type, item.bestDay].filter(Boolean).join(' / '))}</td>
                            <td>${escapeHtml([item.must, item.strategy].filter(Boolean).join('；'))}</td>
                        </tr>`).join('')}</tbody>
                </table>
            </section>
        </section>`;

    html += `
        ${sectionDivider('停車、導航與備案', '手機負責導航，紙本負責斷網、分車、臨時改行程時快速查詢。')}

        <section class="print-manual-page print-page">
            <h2>每日停車 / 導航搜尋索引</h2>
            <p class="print-section-lead">下表不是導航連結，而是紙本備援用的 Google Maps 搜尋字。兩車可分別輸入同一組文字，避免只靠前導車。</p>
            <table class="print-table print-parking-table">
                <thead><tr><th>日</th><th>場景</th><th>紙本標籤</th><th>Google Maps 搜尋字</th></tr></thead>
                <tbody>${parkingRows}</tbody>
            </table>
        </section>

        ${backupSection('oita', '大分 / 別府 / 由布院')}
        ${backupSection('kumamoto', '熊本 / 阿蘇 / 上天草')}

        <section class="print-manual-page print-page print-final-page">
            <h2>最後一頁：出門前 10 分鐘檢查</h2>
            <div class="print-two-col">
                <section class="print-card print-card-primary">
                    <h3>今天出門前</h3>
                    <div class="print-check-grid one-col">${compactRows([
                        '護照、駕照、譯本、信用卡、現金、飯店鑰匙。',
                        '兩台車都已輸入下一站與停車場，不只輸入景點名稱。',
                        '小孩上廁所、水壺補滿、車上點心與濕紙巾在前座可拿。',
                        '手機電量、行動電源、eSIM/漫遊、LINE 群組正常。',
                        '今日硬切時間已講給兩位駕駛與另一位大人知道。',
                        '晚餐 Plan A / Plan B 已決定，避免傍晚臨時搜尋。'
                    ])}</div>
                </section>
                <section class="print-card print-card-warning">
                    <h3>當天失控時的縮減規則</h3>
                    ${simpleList([
                        '先砍購物，再砍非主菜景點，不砍吃飯與睡眠。',
                        '下雨時優先改室內、商場、飯店休息，不硬跑山路與海邊。',
                        '孩子累、駕駛累、天色晚，任何一項成立就不加點。',
                        '返程日 15:30 後不新增景點；只處理加油、還車、機場。'
                    ])}
                    <div class="print-fill-box large">
                        <strong>臨時記錄</strong>
                        <div></div><div></div><div></div><div></div><div></div>
                    </div>
                </section>
            </div>
        </section>`;

    return html;
}

<tr><th>質問事項</th><td>問題事項</td><td>拒絕入境、犯罪紀錄、毒品/槍械等問題照實回答；一般無特殊狀況多為「いいえ / No」。</td></tr>
<tr><th>携帯品・別送品申告</th><td>攜帶品/後送品海關申報</td><td>一般旅遊沒有別送品、商業貨、超額酒菸香水、大額現金，多數選「いいえ / No」；有不確定物品就先查規定。</td></tr>
<tr><th>酒類・紙巻・加熱式・葉巻・香水</th><td>酒、紙菸、加熱菸、雪茄、香水</td><td>沒有或未超額就照實填 0/No；超額要輸入數量。</td></tr>
<tr><th>入力内容確認 / 登録完了</th><td>確認輸入內容 / 登錄完成</td><td>完成前逐人核對護照號碼、姓名、生日、抵達日、航班、飯店電話；完成後顯示每位 QR 並截圖。</td></tr>
</tbody>
</table>
</section>
<section class="guide-panel p-4 md:p-5">
<h3 class="text-xl mb-3 flex items-center gap-2"><span>🏥</span> TOKIO OMOTENASHI POLICY 填寫教學</h3>
<table class="guide-table text-left">
<tbody>
<tr><th>定位</th><td>日本境內訪日旅客醫療保險，主要處理在日本突然生病、受傷、住院、手術、醫療搬送等風險。</td></tr>
<tr><th>不是什麼</th><td>不是 VJW 必填、不是日本入境條件、不是台灣旅平險/旅遊不便險替代品。班機延誤、行李延誤、旅程取消主要仍靠台灣保險。</td></tr>
<tr><th>投保地點</th><td>台灣出發通常無法在台灣預先申請；請抵達日本、手機連上日本網路後再開官方頁操作。</td></tr>
<tr><th>生效時間</th><td>常見規則是申請日隔天或入境日，取較晚者開始。若抵達當天才買，當天通常仍需靠台灣旅平險承接風險。</td></tr>
<tr><th>投保人</th><td>必須是 18 歲以上個人。小孩不能當投保人，但可以由大人作投保人、小孩作被保險人。</td></tr>
<tr><th>每人一份</th><td>不要以為爸爸買一張全家都保。每位要保障的人都要確認完成投保、收到完成 Email 或保單資訊。</td></tr>
<tr><th>填寫資料</th><td>Email、密碼、入境/出境日期、投保人資料、被保險人資料、健康確認、重要事項說明、信用卡付款。</td></tr>
<tr><th>就醫用法</th><td>非緊急狀況先聯絡保險服務中心或 App，由對方協助找醫院與處理 cashless medical service。危及生命時先打日本 119。</td></tr>
</tbody>
</table>
<div class="mt-3 p-3 rounded-xl bg-red-50 border border-red-200 text-sm text-red-800 leading-relaxed font-bold">限制提醒：已經生病、受傷、既有疾病、牙科、投保前已發生的狀況通常不能當作事後補票。請誠實回答健康問題，避免理賠失效。</div>
<div class="mt-4 p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-800 leading-relaxed font-bold">畫面語言提醒：TOKIO 申請頁常可選中文或英文；若你看到英文步驟或日文提示，下表可作對照。此保險請抵達日本、連上日本網路後再操作；每位旅客逐一完成。</div>
<h4 class="text-lg font-black text-amber-800 mt-4 mb-2">TOKIO OMOTENASHI POLICY 欄位對照填寫表</h4>
<table class="guide-table text-left">
<thead><tr><th>日文/英文欄位或畫面</th><th>中文意思</th><th>你們這趟建議填法</th></tr></thead>
<tbody>
<tr><th>申込み / Application</th><td>申請/投保</td><td>抵達日本後再開官方頁；台灣網路通常可能無法完成申請。</td></tr>
<tr><th>メールアドレス / E-mail address</th><td>Email</td><td>填可立即收信的 Email；完成投保與登入連結會寄到這裡。</td></tr>
<tr><th>認証文字 / Authentication characters</th><td>畫面驗證碼</td><td>照畫面輸入；收不到信先看垃圾信，再換 Email。</td></tr>
<tr><th>パスワード / Password</th><td>密碼</td><td>通常需英文大小寫、數字、符號組合；先記下來避免下一位投保時卡住。</td></tr>
<tr><th>Schedule / スケジュール入力</th><td>行程/保險期間輸入</td><td>入境日填 2026/05/29；離境日填 2026/06/05。完成前仔細核對，送出後通常不能改。</td></tr>
<tr><th>Arrival date / 入国日</th><td>入境日本日期</td><td>填抵達日本當天。若抵達當天投保，保險多半從隔天 00:00 起算。</td></tr>
<tr><th>Insurance start date / 保険開始日</th><td>保險開始日</td><td>畫面若可選，通常選申請隔天或系統可選最早日；不要誤以為抵達當天立即生效。</td></tr>
<tr><th>Insurance end date / 保険終了日</th><td>保險結束日</td><td>至少涵蓋 2026/06/05 出境當天；這趟保守抓 8 天。</td></tr>
<tr><th>Subscriber / Policyholder / 契約者 / 申込人</th><td>投保人/要保人</td><td>必須是 18 歲以上大人。爸爸或媽媽可幫小孩投保。</td></tr>
<tr><th>Insured / 被保険者</th><td>被保險人</td><td>實際要被保障的人。大人可自己作被保險人；小孩由大人投保、小孩作被保險人。</td></tr>
<tr><th>COPY</th><td>複製投保人資料</td><td>投保人＝被保險人時可按 COPY；幫小孩投保時不要直接 COPY 到小孩資料。</td></tr>
<tr><th>Name / 氏名</th><td>姓名</td><td>依護照英文填，不填中文；每位旅客各自核對。</td></tr>
<tr><th>Date of birth / 生年月日</th><td>出生年月日</td><td>依護照生日選年/月/日。小孩最容易填錯。</td></tr>
<tr><th>Nationality / 国籍</th><td>國籍</td><td>選 Taiwan / 台湾 / TAIWAN 相關選項，依畫面提供為準。</td></tr>
<tr><th>Questions on Insured Person / 被保険者に関する質問</th><td>被保險人健康確認</td><td>目前已生病、受傷、投保前已發生狀況，不要為了投保硬選 No；否則可能不能理賠。</td></tr>
<tr><th>Cancellation / 解約・取消 / Premium refund</th><td>取消/解約/退款處理</td><td>閱讀後依畫面勾選同意。行程未確定前不要亂買，因為事後改資料不方便。</td></tr>
<tr><th>Description of Important Matters / 重要事項説明書</th><td>重要事項說明書</td><td>必須打開確認才能繼續。手機若返回不了，改用 Chrome/Safari 或飯店 Wi‑Fi 下用筆電/平板處理。</td></tr>
<tr><th>Credit Card / クレジットカード</th><td>信用卡付款</td><td>準備 Visa/Master/JCB 與 3D 驗證；台灣卡可能要先開海外交易與簡訊/銀行 App 推播。</td></tr>
<tr><th>Application Completion / 申込完了</th><td>申請完成</td><td>每完成一人就截圖完成頁、確認 Email，並放入手機「日本保險」相簿。</td></tr>
<tr><th>TOKIO MARINE Safety Information</th><td>安全資訊/聯絡 App</td><td>完成後下載或記下聯絡方式。非緊急就醫先聯絡保險服務中心；危急先打 119。</td></tr>
</tbody>
</table>
<div class="mt-3 p-3 rounded-xl bg-amber-50 border border-amber-200 text-sm text-amber-900 leading-relaxed font-bold">8 人團防呆：不要連續填到麻木。每投保 1 人就立刻核對「姓名、生日、保險起訖日、完成 Email」，再填下一位。</div>
</section>

<script data-source="js/controllers/modal.js">
// Dialog open/close and mobile scroll-lock controller.

function createModalController() {
    const syncAppVh = () => {
        document.documentElement.style.setProperty('--app-vh', `${window.innerHeight * 0.01}px`);
    };

    let savedScrollY = 0;

    function lockPageScroll() {
        if (document.body.classList.contains('modal-open')) return;
        savedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
        document.documentElement.classList.add('modal-open');
        document.body.classList.add('modal-open');
        document.body.style.position = 'fixed';
        document.body.style.top = `-${savedScrollY}px`;
        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';
    }

    function unlockPageScrollIfNeeded() {
        const anyOpen = Array.from(document.querySelectorAll('dialog')).some(d => d.open);
        if (anyOpen) return;
        document.documentElement.classList.remove('modal-open');
        document.body.classList.remove('modal-open');
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        window.scrollTo(0, savedScrollY || 0);
    }

    function openDialog(dialog) {
        if (!dialog) return;
        syncAppVh();
        lockPageScroll();
        if (!dialog.open) dialog.showModal();
        requestAnimationFrame(() => {
            dialog.scrollTop = 0;
            const firstScrollable = dialog.querySelector('#dayInfoModalBody, #backup-list-container');
            if (firstScrollable) firstScrollable.scrollTop = 0;
        });
    }

    function showModal(id) {
        const dialog = document.getElementById(id);
        openDialog(dialog);
    }

    function closeModal(id) {
        const dialog = document.getElementById(id);
        if (dialog && dialog.open) dialog.close();
    }

    function bindDialogDismissHandlers() {
        document.querySelectorAll('dialog').forEach(dialog => {
            dialog.addEventListener('click', (e) => {
                const rect = dialog.getBoundingClientRect();
                const isInDialog = (rect.top <= e.clientY && e.clientY <= rect.bottom && rect.left <= e.clientX && e.clientX <= rect.right);
                if (!isInDialog) dialog.close();
            });
            dialog.addEventListener('close', unlockPageScrollIfNeeded);
            dialog.addEventListener('cancel', () => setTimeout(unlockPageScrollIfNeeded, 0));
        });
    }

    function init() {
        window.addEventListener('resize', syncAppVh, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(syncAppVh, 250), { passive: true });
        syncAppVh();
        bindDialogDismissHandlers();
    }

    return { init, openDialog, showModal, closeModal };
}

</script>
<script data-source="js/controllers/tabs.js">
// Day tab routing and tabpanel controller.

function createDayTabsController({ getCurrentDay, setCurrentDay, ensureDayContent }) {
    function initTabs() {
        const container = document.getElementById('tabs-container');
        if (!container) return;
        container.innerHTML = '';
        container.setAttribute('role', 'tablist');
        container.setAttribute('aria-label', '每日行程切換');
        itineraryData.forEach((data) => {
            const btn = document.createElement('button');
            btn.id = `tab-btn-${data.day}`;
            btn.type = 'button';
            btn.setAttribute('role', 'tab');
            btn.setAttribute('aria-controls', `day-content-${data.day}`);
            btn.textContent = `Day ${data.day}`;
            btn.onclick = () => selectDay(data.day);
            container.appendChild(btn);
        });
        updateTabsUI();
    }

    function updateTabsUI() {
        const currentDay = getCurrentDay();
        itineraryData.forEach((data) => {
            const btn = document.getElementById(`tab-btn-${data.day}`);
            if (!btn) return;
            const isActive = data.day === currentDay;
            btn.className = `flex-shrink-0 px-5 py-3 md:py-2.5 rounded-full font-bold text-sm transition-all duration-300 ${isActive ? 'tab-active' : 'tab-inactive hover:bg-kawaii-light-pink hover:text-white hover:border-kawaii-light-pink'}`;
            btn.setAttribute('aria-selected', String(isActive));
            btn.setAttribute('tabindex', isActive ? '0' : '-1');
        });
    }

    function switchDayContent(day) {
        ensureDayContent(day);
        itineraryData.forEach(data => {
            const el = document.getElementById(`day-content-${data.day}`);
            if (el) {
                if (data.day === day) {
                    el.classList.remove('hidden');
                    el.classList.add('block', 'fade-in');
                    el.setAttribute('aria-hidden', 'false');
                } else {
                    el.classList.add('hidden');
                    el.classList.remove('block', 'fade-in');
                    el.setAttribute('aria-hidden', 'true');
                }
            }
        });
    }

    function selectDay(day) {
        setCurrentDay(day);
        window.history.pushState(null, '', `#day${day}`);
        updateTabsUI();
        switchDayContent(day);
        if(window.innerWidth < 768) {
            const content = document.getElementById('itinerary-content');
            if (content) {
                const contentTop = content.getBoundingClientRect().top + window.scrollY;
                window.scrollTo({ top: contentTop - 80, behavior: 'smooth' });
            }
        }
    }

    function handlePopstate() {
        const hash = window.location.hash;
        let day = 1;
        if (hash && hash.startsWith('#day')) {
            const parsedDay = parseInt(hash.replace('#day', ''));
            if (!isNaN(parsedDay) && itineraryData.some(d => d.day === parsedDay)) day = parsedDay;
        }
        setCurrentDay(day);
        updateTabsUI();
        switchDayContent(day);
    }

    function init() {
        initTabs();
        window.addEventListener('popstate', handlePopstate);
    }

    return { init, selectDay, switchDayContent, updateTabsUI };
}

</script>
<script data-source="js/controllers/backup-modal.js">
// Backup modal region/category state controller.

function createBackupModalController() {
    let currentBackupRegion = 'oita';
    let currentBackupCategory = 'sight';

    function render() {
        const container = document.getElementById('backup-list-container');
        renderBackupList(container, currentBackupRegion, currentBackupCategory);
    }

    function setBackupRegion(region) {
        currentBackupRegion = region;
        ['oita', 'kumamoto'].forEach(r => {
            const btn = document.getElementById(`btn-region-${r}`);
            if(btn) {
                if (r === region) {
                    btn.classList.remove('region-btn-inactive', 'border-transparent');
                    btn.classList.add('region-btn-active');
                } else {
                    btn.classList.remove('region-btn-active');
                    btn.classList.add('region-btn-inactive', 'border-transparent');
                }
            }
        });
        render();
    }

    function bindCategoryTabs() {
        const categoryTabs = document.getElementById('backup-category-tabs');
        if (!categoryTabs) return;
        categoryTabs.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn || !btn.dataset.cat) return;

            const category = btn.dataset.cat;
            currentBackupCategory = category;

            categoryTabs.querySelectorAll('button').forEach(b => {
                if (b.dataset.cat === category) {
                    b.classList.remove('category-btn-inactive');
                    b.classList.add('category-btn-active', 'text-cyan-600');
                } else {
                    b.classList.remove('category-btn-active', 'text-cyan-600');
                    b.classList.add('category-btn-inactive');
                }
            });
            render();
        });
    }

    function initBackupModal() {
        setBackupRegion('oita');
    }

    function init() {
        bindCategoryTabs();
    }

    return { init, initBackupModal, setBackupRegion };
}

</script>
<script data-source="js/controllers/clipboard.js">
// Daily itinerary clipboard controller.

function createDailyItineraryClipboardController({ getCurrentDay }) {
    async function copyDailyItinerary() {
        const data = itineraryData.find(d => d.day === getCurrentDay());
        if(!data) return;

        let textToCopy = `🚗 九州大冒險 - Day ${data.day} (${htmlToPlainText(data.date)})\n📌 主題：${htmlToPlainText(data.title)}\n🗺️ 動線：${htmlToPlainText(data.route)}\n🏨 住宿：${htmlToPlainText(data.hotel)}\n\n`;
        data.sections.forEach(sec => {
            textToCopy += `【${htmlToPlainText(sec.title)}】${sec.time ? ` (${htmlToPlainText(sec.time)})` : ''}\n${htmlToPlainText(sec.content)}\n`;
            if(sec.deepTip) textToCopy += `💡 筆記：${htmlToPlainText(sec.deepTip)}\n`;
            textToCopy += `\n`;
        });
        if(data.tips) textToCopy += `⚠️ 注意事項：${htmlToPlainText(data.tips)}\n\n`;

        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(textToCopy);
                alert(`✅ Day ${data.day} 行程與實戰攻略已複製！`);
            } else throw new Error('Clipboard API restricted');
        } catch (err) {
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            textArea.style.position = "fixed"; textArea.style.top = "0"; textArea.style.left = "0";
            document.body.appendChild(textArea);
            textArea.focus(); textArea.select();
            try { document.execCommand('copy'); alert(`✅ Day ${data.day} 行程與實戰攻略已複製！`); }
            catch (fallbackErr) { alert('❌ 複製失敗，請手動選取複製。'); }
            document.body.removeChild(textArea);
        }
    }

    return { copyDailyItinerary };
}

</script>

            const parsedDay = parseInt(hash.replace('#day', ''));
            if (!isNaN(parsedDay) && itineraryData.some(d => d.day === parsedDay)) {
                return parsedDay;

    function setCurrentDay(day) {
        currentDay = day;
    }

    function ensureDayContent(day) {
        const container = document.getElementById('itinerary-content');
        let el = document.getElementById(`day-content-${day}`);
        if (!el) {
            const data = itineraryData.find(d => d.day === day);
            if (!data || !container) return null;
            el = renderDayContent(data, currentDay);
            container.appendChild(el);
        }
        return el;
    }

    function buildInitialDayContent() {
        const container = document.getElementById('itinerary-content');
        if (!container) return;
        container.innerHTML = '';
        ensureDayContent(currentDay);
    }

    const dialogsRoot = document.getElementById('dialogs-root');
    if (dialogsRoot && !dialogsRoot.innerHTML) {
        dialogsRoot.innerHTML = renderStaticModals();
    }

    const modalController = createModalController();
    const tabsController = createDayTabsController({ getCurrentDay, setCurrentDay, ensureDayContent });
    const backupModalController = createBackupModalController();
    const clipboardController = createDailyItineraryClipboardController({ getCurrentDay });

    window.showModal = modalController.showModal;
    window.closeModal = modalController.closeModal;
    window.selectDay = tabsController.selectDay;
    window.initBackupModal = backupModalController.initBackupModal;
    window.setBackupRegion = backupModalController.setBackupRegion;
    window.copyDailyItinerary = clipboardController.copyDailyItinerary;
    window.openDayInfo = (day, mode) => openDayInfoModal(day, mode, modalController.openDialog);
    window.preparePrintView = function() {
        const container = document.getElementById('print-container');
        if (!container || container.dataset.printReady === 'true') return;
        container.innerHTML = renderPrintViewHtml();
        container.dataset.printReady = 'true';
    };

    modalController.init();
    backupModalController.init();
    tabsController.init();
    buildInitialDayContent();
    window.addEventListener('beforeprint', window.preparePrintView);
})();

</script>
</body>
</html>
