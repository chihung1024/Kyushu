/* Day diagnostics: quick trip health readout before the long timeline. */
.day-diagnostics-panel {
  margin: 0 0 1rem;
  padding: 1rem;
  border: 2px solid rgba(15, 23, 42, 0.08);
  border-radius: 1.25rem;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(239, 246, 255, 0.9));
  box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
}

.day-diagnostic-title {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-bottom: 0.75rem;
  color: #111827;
  font-size: 0.75rem;
  font-weight: 900;
  letter-spacing: 0.08em;
}

.day-diagnostic-chips {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.5rem;
}

.day-diagnostic-chip {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem;
  min-height: 2.5rem;
  padding: 0.55rem 0.7rem;
  border-radius: 0.9rem;
  border: 1px solid rgba(148, 163, 184, 0.35);
  background: #fff;
  color: #334155;
  font-size: 0.75rem;
  font-weight: 800;
}

.day-diagnostic-chip strong {
  color: #0f172a;
  font-size: 1rem;
  font-weight: 900;
}

.day-diagnostic-chip.must { border-color: #fecdd3; background: #fff1f2; color: #be123c; }
.day-diagnostic-chip.flex { border-color: #bae6fd; background: #f0f9ff; color: #0369a1; }
.day-diagnostic-chip.check { border-color: #fed7aa; background: #fff7ed; color: #c2410c; }
.day-diagnostic-chip.map { border-color: #bbf7d0; background: #f0fdf4; color: #15803d; }
.day-diagnostic-chip.muted { background: #f8fafc; color: #64748b; }

.day-diagnostic-cut {
  margin-top: 0.75rem;
  padding: 0.75rem;
  border-left: 4px solid #f97316;
  border-radius: 0.9rem;
  background: #fff7ed;
  color: #7c2d12;
  font-size: 0.8rem;
  line-height: 1.55;
}

.day-diagnostic-cut span {
  display: block;
  margin-bottom: 0.2rem;
  font-size: 0.7rem;
  font-weight: 900;
  letter-spacing: 0.06em;
}

.day-diagnostic-cut strong {
  font-weight: 900;
}

@media (min-width: 640px) {
  .day-diagnostic-chips {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

/* === css/decision-center.css === */
/* decision-center-ui-v3: calm, field-use oriented modal and food decision cards. */
:root{
  --decision-ink:#172033;
  --decision-muted:#64748b;
  --decision-line:#e2e8f0;
  --decision-soft:#f8fafc;
  --decision-surface:#ffffff;
  --decision-primary:#0f172a;
  --decision-cyan:#0e7490;
  --decision-cyan-soft:#ecfeff;
  --decision-amber:#b45309;
  --decision-amber-soft:#fffbeb;
  --decision-red:#b91c1c;
  --decision-red-soft:#fef2f2;
  --decision-shadow:0 18px 44px rgba(15,23,42,.12);
  --decision-shadow-soft:0 8px 22px rgba(15,23,42,.06);
}

#backupModal.decision-modal{
  overflow:hidden!important;
  background:linear-gradient(180deg,#fff 0%,#f8fafc 100%)!important;
  border:1px solid rgba(226,232,240,.96)!important;
}
.decision-modal-close{
  position:absolute;top:1rem;right:1rem;z-index:30;width:2.75rem;height:2.75rem;
  border-radius:999px;background:#fff;border:1px solid var(--decision-line);color:#475569;
  font-weight:950;font-size:1.05rem;box-shadow:0 8px 20px rgba(15,23,42,.08);
  display:flex;align-items:center;justify-content:center;transition:.18s ease;
}
.decision-modal-close:hover{background:#0f172a;color:#fff;transform:translateY(-1px)}
.decision-modal-header{
  position:sticky;top:0;z-index:20;padding:1.15rem 1.25rem 1rem;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--decision-line);
}
.decision-modal-titlebar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.72fr);gap:1rem;align-items:end;padding-right:3.3rem}
.decision-modal-kicker{font-size:.68rem;font-weight:950;letter-spacing:.12em;color:var(--decision-cyan);text-transform:uppercase;margin-bottom:.25rem}
.decision-modal-titlebar h2{font-size:1.55rem;line-height:1.22;font-weight:950;color:var(--decision-ink);margin:0}
.decision-modal-titlebar p{font-size:.88rem;line-height:1.7;color:var(--decision-muted);font-weight:740;margin-top:.42rem;max-width:780px}
.decision-modal-principle{background:var(--decision-soft);border:1px solid var(--decision-line);border-radius:18px;padding:.75rem .85rem;box-shadow:var(--decision-shadow-soft)}
.decision-modal-principle strong{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#334155;font-weight:950;margin-bottom:.22rem}
.decision-modal-principle span{display:block;color:#475569;font-size:.82rem;line-height:1.6;font-weight:800}
.decision-modal-nav-grid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:.85rem;margin-top:1rem}
.decision-nav-block{border:1px solid var(--decision-line);background:#fff;border-radius:18px;padding:.72rem;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.decision-nav-label{display:block;font-size:.7rem;font-weight:950;letter-spacing:.08em;color:#64748b;text-transform:uppercase;margin:0 0 .45rem .15rem}
.decision-segment,.decision-category-tabs{display:grid;gap:.5rem}.decision-segment{grid-template-columns:repeat(2,minmax(0,1fr))}.decision-category-tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
.decision-segment-btn,.decision-category-tab{min-height:3.25rem;border-radius:14px;border:1px solid var(--decision-line);background:#f8fafc;color:#334155;padding:.55rem .7rem;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:.05rem;font-weight:900;transition:.16s ease;text-align:left}
.decision-segment-btn span,.decision-category-tab span{font-size:.86rem;line-height:1.25}.decision-segment-btn small,.decision-category-tab small{font-size:.67rem;line-height:1.25;color:#64748b;font-weight:850}
.decision-segment-btn:hover,.decision-category-tab:hover{background:#fff;transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,23,42,.07)}
.decision-segment-btn.is-active,.decision-category-tab.is-active{background:#0f172a;color:#fff;border-color:#0f172a;box-shadow:0 10px 22px rgba(15,23,42,.16)}
.decision-segment-btn.is-active small,.decision-category-tab.is-active small{color:#cbd5e1}.decision-category-tab.is-active:nth-child(2){background:#0e7490;border-color:#0e7490}.decision-category-tab.is-active:nth-child(3){background:#78350f;border-color:#78350f}

<script data-source="js/utils/html.js">
// Shared HTML safety and text conversion helpers.
// Keep this file dependency-free because it is loaded as a plain browser script
// and also evaluated inside Node smoke tests.

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeAttr(value) {
  return escapeHtml(value);
}

function decodeBasicHtmlEntities(value) {
  return String(value ?? '')
    .replace(/&nbsp;/gi, ' ')
    .replace(/&amp;/gi, '&')
    .replace(/&lt;/gi, '<')
    .replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"')
    .replace(/&#39;/gi, "'")
    .replace(/&apos;/gi, "'");
}

function htmlToPlainText(html) {
  return decodeBasicHtmlEntities(
    String(html ?? '')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/\s*(p|div|li|tr|h[1-6])\s*>/gi, '\n')
      .replace(/<\s*li(?:\s[^>]*)?>/gi, '• ')
      .replace(/<[^>]*>/g, '')
  )
    .replace(/\r\n/g, '\n')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n[ \t]+/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function safeExternalUrl(value, fallback = '#') {
  const url = String(value ?? '').trim();
  if (/^https:\/\//i.test(url) || /^http:\/\//i.test(url)) return url;
  return fallback;
}

function getParkingButtonLabel(query) {

            const cleaned = key
                .replace(/熊本市中央区新市街8-7/g, '')
                .replace(/\s*(駐車場|停車場)\s*$/g, '')
                .replace(/\s+/g, ' ')
                .trim();
            return `${cleaned || '目的地'}停車場導航`;

<script data-source="js/components/daily-gourmet.js">
// Daily food, sweets and snack decision section render helpers.

function escapeDailyGourmetHtml(value) {
    return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function normalizeDailyFoodRankClass(rank) {
    return String(rank || 'B').replace(/[^A-Za-z0-9_-]/g, '').replace(/-/g, 'minus').toLowerCase();
}

function dailyFoodChip(label, value, cssClass = '') {
    if (!value) return '';
    return `<span class="daily-food-chip ${escapeDailyGourmetHtml(cssClass)}"><b>${escapeDailyGourmetHtml(label)}</b>${escapeDailyGourmetHtml(value)}</span>`;
}

function renderDailyGourmet(day) {
    const data = dayGourmetDB[day];

<script data-source="js/components/backup-list.js">
// Backup spot, shop and gourmet decision center renderers.
// The modal is intentionally decision-first: keep main routes safe, then decide
// whether a spot / meal / supply run is worth inserting.

const BACKUP_RANK_ORDER = ['S', 'S-', 'A', 'B+', 'B', 'B-', 'C', 'X'];
const BACKUP_RANK_SCORE = { S: 90, 'S-': 85, A: 70, 'B+': 62, B: 55, 'B-': 48, C: 35, X: 5 };
const BACKUP_RANK_META = {
    S: { label: '主線核心', tone: 's', copy: '應固定保留；不要再把其他加點壓到它前面。' },
    'S-': { label: '條件型主線', tone: 's', copy: '價值高，但必須服從天候、潮汐、時間或返程安全。' },
    A: { label: '高優先加點', tone: 'a', copy: '有條件就做；時間不足時可以砍，不需要補償。' },
    'B+': { label: '強力救場', tone: 'b', copy: '下雨、太熱、孩子累、主線提前結束時使用。' },
    B: { label: '情境救場', tone: 'b', copy: '主要價值是解決現場問題，不是增加景點數。' },
    'B-': { label: '需重排備案', tone: 'b', copy: '除非整段改線，否則不硬插。' },
    C: { label: '收藏', tone: 'c', copy: '保留在資料庫；這趟不主動排。' },
    X: { label: '本趟不建議', tone: 'x', copy: '景點本身可能很好，但會破壞本趟節奏。' },
};

const FOOD_CATEGORY_ORDER = [
    '主線餐',
    '高優先餐',
    '地方代表',
    '親子保底',
    '保底餐 / 補給',
    '甜點零食',
    '甜點零食 / 伴手禮',
    '伴手禮',
    '願望餐',
    '成人加碼',
    '收藏',
    '不建議硬追',
];
const FOOD_RANK_SCORE = { S: 90, 'S-': 84, A: 70, B: 52, C: 30, X: 0 };
const FOOD_RANK_META = {
    S: { label: '主線餐', tone: 's', copy: '可以為它保留時間，但仍要服從硬切時間。' },
    'S-': { label: '條件主線', tone: 's', copy: '值得吃；但需要天候、排隊或當天動線成立。' },
    A: { label: '高優先', tone: 'a', copy: '有時間就攻；排隊過長就降級。' },
    B: { label: '保底 / 救場', tone: 'b', copy: '孩子累、太晚、天候差時用。' },
    C: { label: '收藏', tone: 'c', copy: '可以記住，但這趟不主動追。' },
    X: { label: '不建議硬追', tone: 'x', copy: '不是不好吃，而是不符合這趟節奏。' },
};

function normalizeBackupEntry(item) {
    if (!item) return { title: '', desc: '', rank: 'B', mapQuery: '', tags: [] };
    if (typeof item === 'object') {
        const title = String(item.title || item.name || '').trim();
        const rank = String(item.rank || (item.starred ? 'S' : 'B')).trim();
        return {
            title,
            desc: String(item.desc || item.description || '').trim(),
            rank,
            type: String(item.type || '').trim(),
            bestDays: String(item.bestDays || item.bestDay || '').trim(),
            time: String(item.time || '').trim(),
            risk: String(item.risk || '').trim(),
            condition: String(item.condition || '').trim(),
            sacrifice: String(item.sacrifice || '').trim(),
            decision: String(item.decision || '').trim(),
            mapQuery: item.mapQuery || title,
            tags: Array.isArray(item.tags) ? item.tags : [],
            includeInPaper: item.includeInPaper !== false,
        };
    }
    const raw = String(item);
    const separatorIndex = raw.indexOf('|');
    const rawTitle = separatorIndex >= 0 ? raw.slice(0, separatorIndex) : raw;
    const desc = separatorIndex >= 0 ? raw.slice(separatorIndex + 1) : '';
    const starred = rawTitle.includes('⭐');
    const title = rawTitle.replace('⭐', '').trim();
    return { title, desc: desc.trim(), rank: starred ? 'S' : 'B', mapQuery: title, tags: [] };
}

function getBackupRankMeta(rank) {
    return BACKUP_RANK_META[rank] || BACKUP_RANK_META.B;
}

function getFoodRankMeta(rank) {
    return FOOD_RANK_META[rank] || FOOD_RANK_META.B;
}

function sortBackupEntries(entries) {
    return entries.slice().sort((a, b) => {
        const rankDelta = (BACKUP_RANK_SCORE[b.rank] || 0) - (BACKUP_RANK_SCORE[a.rank] || 0);
        return rankDelta || String(a.title).localeCompare(String(b.title), 'zh-Hant');
    });
}

function sortFoodEntries(entries) {
    return entries.slice().sort((a, b) => {
        const priorityDelta = (b.paperPriority || 0) - (a.paperPriority || 0);
        const rankDelta = (FOOD_RANK_SCORE[b.rank] || 0) - (FOOD_RANK_SCORE[a.rank] || 0);
        return priorityDelta || rankDelta || String(a.name).localeCompare(String(b.name), 'zh-Hant');
    });
}

function compactCount(entries, ranks) {
    return entries.filter(item => ranks.includes(item.rank)).length;
}

function renderDecisionMetric(label, value) {
    return `<span class="decision-metric"><strong>${escapeHtml(String(value))}</strong>${escapeHtml(label)}</span>`;
}

function getRankLegend(category) {
    if (category === 'food') return 'S 主線餐 / A 可攻 / B 保底 / C 收藏 / X 不硬追';
    if (category === 'shop') return 'S 主力補給 / A 順路優先 / B 缺東西才用 / C/X 不主動排';
    return 'S 主線 / A 可攻 / B 救場 / C 收藏 / X 不建議';
}

function backupMetaChip(label, value) {
    if (!value) return '';
    return `<span class="decision-chip"><b>${escapeHtml(label)}</b>${escapeHtml(value)}</span>`;
}

function backupActionLinks(entry) {
    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(entry.mapQuery || entry.title)}`;
    const searchUrl = `https://www.google.com/search?q=${encodeURIComponent((entry.mapQuery || entry.title) + ' 営業時間 駐車場 公式')}`;
    return `<div class="decision-card-actions">
        <a href="${escapeAttr(mapUrl)}" target="_blank" rel="noopener noreferrer">導航</a>
        <a href="${escapeAttr(searchUrl)}" target="_blank" rel="noopener noreferrer">查營業 / 停車</a>
    </div>`;
}

function renderDecisionRow(label, value, tone = '') {
    if (!value) return '';
    return `<div class="decision-row ${escapeAttr(tone)}"><b>${escapeHtml(label)}</b><span>${escapeHtml(value)}</span></div>`;
}

function renderDecisionBackupCard(entry, compact = false) {
    const meta = getBackupRankMeta(entry.rank);
    const tagHtml = (entry.tags || []).slice(0, compact ? 2 : 4).map(tag => `<span>${escapeHtml(tag)}</span>`).join('');
    return `<article class="decision-card rank-tone-${escapeAttr(meta.tone)} ${compact ? 'compact' : ''}">
        <div class="decision-card-head">
            <span class="decision-rank rank-tone-${escapeAttr(meta.tone)}">${escapeHtml(entry.rank)}</span>
            <div class="min-w-0">
                <h4>${escapeHtml(entry.title)}</h4>
                ${entry.desc ? `<p>${escapeHtml(entry.desc)}</p>` : ''}
            </div>
        </div>
        <div class="decision-chip-row">
            ${backupMetaChip('類型', entry.type)}
            ${backupMetaChip('適合', entry.bestDays)}
            ${backupMetaChip('時間', entry.time)}
            ${backupMetaChip('風險', entry.risk)}
        </div>
        <div class="decision-rows">
            ${renderDecisionRow('適合情境', entry.condition || meta.copy)}
            ${renderDecisionRow('犧牲代價', entry.sacrifice)}
            ${renderDecisionRow('一句決策', entry.decision, 'primary')}
        </div>
        ${tagHtml ? `<div class="decision-tags">${tagHtml}</div>` : ''}
        ${backupActionLinks(entry)}
    </article>`;
}

function renderDecisionHero(entries, currentBackupCategory, currentBackupRegion) {
    const titleMap = { sight: '去哪裡', food: '吃什麼', shop: '怎麼補給' };
    const subtitleMap = {
        sight: '先保護主線，再用 A/B 備案處理天候、疲勞與早到晚到。',
        food: '先選可控餐，再看排隊與孩子電量；甜點只服務行程，不反客為主。',
        shop: '把補給視為風險控制，不把購物變成第二套行程。',
    };
    const regionName = currentBackupRegion === 'oita' ? '大分・別府・由布院' : '熊本・阿蘇・上天草';
    const metrics = [
        renderDecisionMetric('全部', entries.length),
        renderDecisionMetric('S / S-', compactCount(entries, ['S', 'S-'])),
        renderDecisionMetric('A', compactCount(entries, ['A'])),
        renderDecisionMetric('B 系', entries.filter(item => String(item.rank || '').startsWith('B')).length),
        renderDecisionMetric('C / X', compactCount(entries, ['C', 'X'])),
    ].join('');
    return `<section class="decision-hero">
        <div>
            <div class="decision-eyebrow">${escapeHtml(regionName)}</div>
            <h3>${escapeHtml(titleMap[currentBackupCategory] || '現場決策')}</h3>
            <p>${escapeHtml(subtitleMap[currentBackupCategory] || '')}</p>
        </div>
        <div class="decision-metrics">${metrics}</div>
    </section>`;
}

function renderDecisionRuleStrip(category) {
    const rules = category === 'food'
        ? ['排隊超過 30 分鐘：降級', '返程日不追名店', '小孩餓了先保底', '生食與牡蠣保守處理']
        : category === 'shop'
            ? ['先買水與點心', '缺東西才進商場', '購物不壓縮睡眠', '返程日只買機場可帶走']
            : ['先看硬切時間', '孩子累直接降級', '下雨改室內', '不為補點犧牲還車'];
    return `<div class="decision-rule-strip">${rules.map(rule => `<span>${escapeHtml(rule)}</span>`).join('')}</div>`;
}

function renderDecisionSectionIntro(title, description, label = 'FIELD PICKS') {
    return `<header class="decision-section-intro">
        <div>
            <span>${escapeHtml(label)}</span>
            <h3>${escapeHtml(title)}</h3>
            <p>${escapeHtml(description)}</p>
        </div>
    </header>`;
}

function renderDecisionSpotlight(entries, category) {
    const picks = entries.filter(item => ['S', 'S-', 'A'].includes(item.rank)).slice(0, 3);
    if (!picks.length) return '';
    const title = category === 'food' ? '先看這幾個' : category === 'shop' ? '最穩補給' : '優先判斷';
    const description = category === 'shop'
        ? '先處理水、點心、藥妝與停車；不需要時不要把補給變成第二套行程。'
        : category === 'food'
            ? '先用 S / A 做決策；排隊、孩子狀態或硬切時間不合時，直接降級。'
            : '先看 S / A，再看 B；C / X 僅作提醒，不主動排。';
    return `<section class="decision-spotlight">
        ${renderDecisionSectionIntro(title, description, getRankLegend(category))}
        <div class="decision-spotlight-grid">
            ${picks.map(item => renderDecisionBackupCard(item, true)).join('')}
        </div>
    </section>`;
}

function renderDecisionBackupList(container, currentBackupRegion, currentBackupCategory) {
    const rawList = backupDB[currentBackupRegion]?.[currentBackupCategory] || [];
    const entries = sortBackupEntries(rawList.map(normalizeBackupEntry).filter(entry => entry.title));

    if (!entries.length) {
        container.innerHTML = `<div class="decision-empty">目前沒有符合的備案資料。</div>`;
        return;
    }

    const grouped = entries.reduce((acc, entry) => {
        const rank = entry.rank || 'B';
        if (!acc[rank]) acc[rank] = [];
        acc[rank].push(entry);
        return acc;
    }, {});

    const groupHtml = BACKUP_RANK_ORDER
        .filter(rank => grouped[rank] && grouped[rank].length)
        .map(rank => {
            const meta = getBackupRankMeta(rank);
            return `<section class="decision-section rank-tone-${escapeAttr(meta.tone)}">
                <header>
                    <div><span class="decision-rank rank-tone-${escapeAttr(meta.tone)}">${escapeHtml(rank)}</span><h3>${escapeHtml(meta.label)}</h3></div>
                    <p>${escapeHtml(meta.copy)}</p>
                </header>
                <div class="decision-card-grid">
                    ${grouped[rank].map(item => renderDecisionBackupCard(item)).join('')}
                </div>
            </section>`;
        }).join('');

    container.innerHTML = `<div class="decision-layout animate-[fadeIn_0.3s_ease-out]">
        ${renderDecisionHero(entries, currentBackupCategory, currentBackupRegion)}
        ${renderDecisionRuleStrip(currentBackupCategory)}
        ${renderDecisionSpotlight(entries, currentBackupCategory)}
        ${groupHtml}
    </div>`;
}

function normalizeFoodRankClass(rank) {
    return String(rank || 'B').replace(/[^A-Za-z0-9_-]/g, '').replace(/-/g, 'minus').toLowerCase();
}

function foodDecisionChip(label, value) {
    if (!value) return '';
    return `<span class="decision-chip"><b>${escapeHtml(label)}</b>${escapeHtml(value)}</span>`;
}

function getFoodAvoidText(item) {
    if (item.warning) return item.warning;
    if (item.rank === 'X') return '不要為它改動主線；這趟只作提醒。';
    if (item.rank === 'C') return '這趟不主動追，剛好遇到再說。';
    if (String(item.queueRisk || '').includes('高')) return '排隊或等待過長就放棄，不補償。';
    return '排隊、孩子狀態或硬切時間不對，就直接降級。';
}

function getFoodFallbackText(item) {
    const category = item.category || '';
    if (category.includes('甜點')) return '買不到就改便利商店甜點或飯店宵夜，不補點。';
    if (category.includes('伴手禮')) return '最後可用機場 / 商場伴手禮櫃收斂。';
    if (category.includes('保底')) return '這本身就是保底，不需要再找第二個保底。';
    if (item.area && item.area.includes('別府')) return '改 Youme Town / MEGA Trial / 飯店附近餐。';
    if (item.area && item.area.includes('天草')) return '改天のや、道之驛或車上補給。';
    return '改商場、美食街、便利商店或飯店附近可控餐。';
}

function renderFoodDecisionCard(item, compact = false) {
    const rank = item.rank || 'B';
    const rankKey = normalizeFoodRankClass(rank);
    const rankMeta = getFoodRankMeta(rank);
    const query = item.mapQuery || item.name;
    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query || '')}`;
    const searchUrl = `https://www.google.com/search?q=${encodeURIComponent((query || '') + ' 営業時間 定休日 メニュー 予約 テイクアウト')}`;
    const links = (item.links || []).slice(0, compact ? 1 : 2).map(link => {
        const url = safeExternalUrl(link.url, mapUrl);
        return `<a href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.label || '官方')}</a>`;
    }).join('');

    return `<article class="food-card-v3 rank-${escapeAttr(rankKey)} ${compact ? 'compact' : ''}">
        <div class="food-card-top">
            <span class="food-rank-badge rank-${escapeAttr(rankKey)}">${escapeHtml(rank)}</span>
            <div class="min-w-0">
                <a href="${escapeAttr(mapUrl)}" target="_blank" rel="noopener noreferrer" class="food-card-title">${escapeHtml(item.name)}</a>
                <p>${escapeHtml(item.type || rankMeta.label)}</p>
            </div>
        </div>
        <div class="decision-chip-row">
            ${foodDecisionChip('時機', item.bestDay)}
            ${foodDecisionChip('區域', item.area)}
            ${foodDecisionChip('排隊', item.queueRisk)}
            ${foodDecisionChip('外帶', item.takeout)}
        </div>
        <div class="food-decision-grid-v3">
            ${renderDecisionRow('點什麼', item.must || item.order, 'primary')}
            ${renderDecisionRow('適合', item.why || rankMeta.copy)}
            ${renderDecisionRow('不要硬排', getFoodAvoidText(item), 'warn')}
            ${compact ? '' : renderDecisionRow('替代', getFoodFallbackText(item))}
            ${compact ? '' : renderDecisionRow('親子判斷', item.kid)}
            ${compact ? '' : renderDecisionRow('現場策略', item.strategy)}
        </div>
        <div class="decision-card-actions">
            <a href="${escapeAttr(mapUrl)}" target="_blank" rel="noopener noreferrer">導航</a>
            <a href="${escapeAttr(searchUrl)}" target="_blank" rel="noopener noreferrer">查營業 / 外帶</a>
            ${links}
        </div>
    </article>`;
}

function renderFoodSpotlight(sorted) {
    const picks = sorted.filter(item => ['S', 'S-', 'A'].includes(item.rank)).slice(0, 4);
    if (!picks.length) return '';
    return `<section class="food-quick-picks">
        ${renderDecisionSectionIntro('今日先看', '先用 S / A 做決策；不符合條件時，直接往 B、商場、美食街或便利商店降級。', 'FOOD PRIORITY')}
        <div class="food-quick-grid">
            ${picks.map(item => renderFoodDecisionCard(item, true)).join('')}
        </div>
    </section>`;
}

function renderGourmetBackupList(container, currentBackupRegion) {
    if (!container) return;
    const dataList = gourmetBackupDB[currentBackupRegion] || [];
    const regionName = currentBackupRegion === 'oita' ? '大分・別府・由布院' : '熊本・阿蘇・上天草';
    if (!dataList.length) {
        container.innerHTML = `<div class="decision-empty">目前沒有美食備案資料。</div>`;
        return;
    }

    const sorted = sortFoodEntries(dataList);
    const caution = currentBackupRegion === 'kumamoto'
        ? '熊本策略：赤牛、太平燕、天草海鮮與伴手禮分開決策；Day8 返程日只接受可控餐、機場餐與可外帶點心。'
        : '大分策略：別府在地味以地獄蒸、冷麵、琉球丼、豐後牛為核心；由布院只用甜點 / 小吃短打，不把甜點排成主線。';

    const groups = sorted.reduce((acc, item) => {
        const key = item.category || '其他';
        if (!acc[key]) acc[key] = [];
        acc[key].push(item);
        return acc;
    }, {});
    const orderedKeys = Object.keys(groups).sort((a, b) => {
        const ia = FOOD_CATEGORY_ORDER.indexOf(a);
        const ib = FOOD_CATEGORY_ORDER.indexOf(b);
        return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b, 'zh-Hant');
    });

    const groupHtml = orderedKeys.map(key => {
        const items = sortFoodEntries(groups[key]);
        const bestRank = items[0]?.rank || 'B';
        const meta = getFoodRankMeta(bestRank);
        return `<section class="food-section-v3 rank-tone-${escapeAttr(meta.tone)}">
            <header>
                <div>
                    <span>${escapeHtml(items.length)} 選</span>
                    <h3>${escapeHtml(key)}</h3>
                </div>
                <p>${escapeHtml(meta.copy)}</p>
            </header>
            <div class="food-card-grid-v3">${items.map(item => renderFoodDecisionCard(item)).join('')}</div>
        </section>`;
    }).join('');

    container.innerHTML = `<div class="decision-layout food-layout-v3 animate-[fadeIn_0.3s_ease-out]">
        ${renderDecisionHero(sorted, 'food', currentBackupRegion)}
        <section class="food-strategy-card">
            <div><span>用餐策略</span><p>${escapeHtml(caution)} 帶小孩同行時，牡蠣、生魚片、牛肉生食採保守原則；燒肉由成人烤熟後再分食。</p></div>
            <div class="food-strategy-rule"><strong>硬規則</strong><span>排隊或等待超過 30 分鐘，直接降級，不做補償。</span></div>
        </section>
        ${renderDecisionRuleStrip('food')}
        ${renderFoodSpotlight(sorted)}
        ${groupHtml}
    </div>`;
}

function renderBackupList(container, currentBackupRegion, currentBackupCategory) {
    if (!container) return;
    if (currentBackupCategory === 'food') {
        renderGourmetBackupList(container, currentBackupRegion);
        return;
    }
    renderDecisionBackupList(container, currentBackupRegion, currentBackupCategory);
}

</script>

<script data-source="js/components/print-view.js">
// Print-friendly paper travel manual renderer.
// The browser app remains interactive; this renderer builds a dedicated A4 guide
// for print/PDF export when window.print() is invoked.

function renderPrintViewHtml() {
    const normalizePrintText = (value) => String(value || '')
        .replace(/[\x00-\x1f\x7f]/g, ' ')
        .replace(/[\uFE0E\uFE0F]/g, '')
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
        .replace(/\s+/g, ' ')
        .replace(/\s*([，。；：、！？])\s*/g, '$1')
        .trim();

    const removePrintActionBlocks = (html) => String(html || '')
        .replace(/<button[\s\S]*?<\/button>/gi, '')
        .replace(/<div\s+class=["'][^"']*(?:flex|gap-2|mt-3)[^"']*["'][^>]*>[\s\S]*?<\/div>/gi, '')
        .replace(/<a\b[^>]*>([\s\S]*?)<\/a>/gi, '$1');

    const plainText = (value) => normalizePrintText(htmlToPlainText(removePrintActionBlocks(value)));
    const plain = (value) => escapeHtml(plainText(value));
    const inline = (value) => plain(value).replace(/\n+/g, ' / ');
    const stripTitlePrefix = (value) => plainText(value).replace(/^Day\s*\d+\s*[｜|]\s*/i, '').trim();
    const splitText = (value) => String(value || '')
        .split(/[｜|]/)
        .map(part => normalizePrintText(part))
        .filter(Boolean);

    const compactRows = (items) => (items || [])
        .map(item => `<div class="print-check-row"><span class="print-box">□</span><span>${escapeHtml(normalizePrintText(item))}</span></div>`)
        .join('');

    const simpleList = (items) => `<ul class="print-simple-list">${(items || [])
        .map(item => `<li>${escapeHtml(normalizePrintText(item))}</li>`)
        .join('')}</ul>`;

    const miniStat = (label, value) => `<div class="print-stat"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;

    const getParkingQueries = (mapQuery) => {
        const raw = parkingLookup && parkingLookup[mapQuery];
        if (!raw) return [];
        return Array.isArray(raw) ? raw : [raw];
    };

    const getParkingLabel = (query) => normalizePrintText((parkingLabelLookup && parkingLabelLookup[query]) || query);

    const allRegularSections = itineraryData.flatMap(day => (day.sections || [])
        .filter(sec => sec.type !== 'rain' && sec.time !== '彈性方案')
        .map(sec => ({ day: day.day, date: day.date, ...sec })));

    const uniqueParkingRows = [];
    const seenParking = new Set();
    itineraryData.forEach(day => {
        (day.sections || []).forEach(sec => {
            const queries = getParkingQueries(sec.mapQuery);
            queries.forEach(query => {
                const key = `${day.day}|${query}`;
                if (seenParking.has(key)) return;
                seenParking.add(key);
                uniqueParkingRows.push({
                    day: day.day,
                    scene: stripTitlePrefix(sec.title || sec.mapQuery || ''),
                    query: normalizePrintText(query),
                    label: getParkingLabel(query)
                });
            });
        });
    });

                    note: normalizePrintText(item.note || item.fit || ''),
                    caution: normalizePrintText(item.caution || '')
                });
            });
        });
        const score = { S: 5, 'S-': 4, A: 3, B: 2, C: 1, X: 0 };
        return items
            .sort((a, b) => ((b.paperPriority || score[b.rank] || 0) - (a.paperPriority || score[a.rank] || 0)))

            const descParts = [entry.desc, entry.condition ? `條件：${entry.condition}` : '', entry.decision ? `決策：${entry.decision}` : ''];
            return {
                name,
                rank: normalizePrintText(entry.rank || 'B'),
                desc: normalizePrintText(descParts.filter(Boolean).join('；')),
                includeInPaper: entry.includeInPaper !== false,
                score: backupRankScore[entry.rank] || 0
            };
        }
        const parts = splitText(entry);
        const name = normalizePrintText((parts[0] || '').replace(/^⭐\s*/, ''));
        const starred = /^⭐/.test(String(entry || ''));
        return { name, rank: starred ? 'S' : 'B', desc: normalizePrintText(parts.slice(1).join('｜')), includeInPaper: true, score: starred ? 90 : 55 };

<div class="priority-grid text-sm font-bold leading-relaxed text-gray-800">
<div class="p-4 rounded-2xl bg-white border-2 border-red-200"><span class="risk-badge bg-red-100 text-red-700 mb-2">S1 入境文件</span><br/>每位旅客：護照、VJW QR、回程機票、第一晚飯店地址電話。QR code 要截圖與紙本雙備份。</div>
<div class="p-4 rounded-2xl bg-white border-2 border-red-200"><span class="risk-badge bg-red-100 text-red-700 mb-2">S2 自駕文件</span><br/>每位駕駛：台灣駕照正本＋日文譯本＋護照。租車主約人另備信用卡與 Budget 訂單。</div>
<div class="p-4 rounded-2xl bg-white border-2 border-red-200"><span class="risk-badge bg-red-100 text-red-700 mb-2">S3 兒童安全座椅</span><br/>6 歲以下必備兒童座椅；取車時確認數量、尺寸、固定方式。兩台車都要核對，不要只看訂單。</div>
</div>
</section>
<section class="guide-panel p-4 md:p-5">

<table class="guide-table">
<tr><th>入境</th><td>護照效期、VJW 每人 QR、回程機票、第一晚住宿資料、全家英文姓名與生日核對。</td></tr>
<tr><th>駕駛</th><td>台灣駕照正本、日文譯本、護照、Budget 訂單、主約人信用卡、ETC/保險/免責補償條件截圖。</td></tr>
<tr><th>保險</th><td>台灣旅平險＋旅遊不便險先買完整旅程；TOKIO 抵達日本後再逐人加保並截圖完成頁。</td></tr>
<tr><th>住宿</th><td>每間飯店訂單、兒童同住政策截圖、停車方式、早餐/入浴稅、取消期限、Check-in 時間。</td></tr>

<tr><th>離線備份</th><td>建立手機相簿：護照/VJW/保險/租車/飯店/訂位/停車/緊急聯絡。重要資料同步給另一位大人。</td></tr>
<tr><th>緊急聯絡</th><td>台灣旅平險專線、TOKIO/日本就醫聯絡、信用卡海外掛失、飯店電話、租車店電話、119 急救。</td></tr>
</table>
</section>
<section class="guide-panel p-4 md:p-5 bg-blue-50 border-blue-200">
<h3 class="text-xl mb-3 flex items-center gap-2"><span>🚗</span> 租車與右駕文件包</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm font-bold leading-relaxed text-gray-800">
<div class="bg-white border border-blue-100 rounded-xl p-3"><strong class="text-blue-800">透明文件夾：</strong>護照、台灣駕照正本、日文譯本、Budget 訂單、信用卡、保險條件、兒童座椅預約截圖。</div>
<div class="bg-white border border-blue-100 rounded-xl p-3"><strong class="text-blue-800">取車必拍：</strong>車身四面、輪框、後照鏡、行李箱、油量、里程、ETC、座椅、既有刮傷。</div>
<div class="bg-white border border-blue-100 rounded-xl p-3"><strong class="text-blue-800">右駕提醒：</strong>靠左行駛、右轉讓直行與左轉車、窄路不要壓線、停車場先慢慢適應車寬。</div>
<div class="bg-white border border-blue-100 rounded-xl p-3"><strong class="text-blue-800">兒童座椅：</strong>6 歲以下必用；6 歲以上但身高不足者，仍建議用增高墊讓安全帶落點正確。</div>
</div>
<p class="mt-3 text-xs text-blue-900 bg-white border border-blue-100 rounded-lg p-3 font-bold leading-relaxed">防呆句：台灣旅客在日本自駕，核心不是國際駕照，而是「台灣駕照正本＋日文譯本＋護照」。兩車駕駛都要各自備齊，不要集中放同一包。</p>
</section>

<tr><th>生鮮</th><td>水果、生鮮蔬菜、種子、盆栽、未處理植物。親子零食以餅乾、糖果、茶包等低風險包裝食品為主。</td></tr>
<tr><th>機上餐</th><td>吃不完的含肉三明治、便當、水果不要帶下飛機入境。</td></tr>

<div>
<div class="font-black text-purple-700 mb-2">藥品與常備包</div>

<script data-source="js/controllers/modal.js">
// Dialog open/close and mobile scroll-lock controller.

function createModalController() {
    const syncAppVh = () => {
        document.documentElement.style.setProperty('--app-vh', `${window.innerHeight * 0.01}px`);
    };

    let savedScrollY = 0;

    function lockPageScroll() {
        if (document.body.classList.contains('modal-open')) return;
        savedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
        document.documentElement.classList.add('modal-open');
        document.body.classList.add('modal-open');
        document.body.style.position = 'fixed';
        document.body.style.top = `-${savedScrollY}px`;
        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';
    }

    function unlockPageScrollIfNeeded() {
        const anyOpen = Array.from(document.querySelectorAll('dialog')).some(d => d.open);
        if (anyOpen) return;
        document.documentElement.classList.remove('modal-open');
        document.body.classList.remove('modal-open');
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        window.scrollTo(0, savedScrollY || 0);
    }

    function openDialog(dialog) {
        if (!dialog) return;
        syncAppVh();
        lockPageScroll();
        if (!dialog.open) dialog.showModal();
        requestAnimationFrame(() => {
            dialog.scrollTop = 0;
            const firstScrollable = dialog.querySelector('#dayInfoModalBody, #backup-list-container');
            if (firstScrollable) firstScrollable.scrollTop = 0;
        });
    }

    function showModal(id) {
        const dialog = document.getElementById(id);
        openDialog(dialog);
    }

    function closeModal(id) {
        const dialog = document.getElementById(id);
        if (dialog && dialog.open) dialog.close();
    }

    function bindDialogDismissHandlers() {
        document.querySelectorAll('dialog').forEach(dialog => {
            dialog.addEventListener('click', (e) => {
                const rect = dialog.getBoundingClientRect();
                const isInDialog = (rect.top <= e.clientY && e.clientY <= rect.bottom && rect.left <= e.clientX && e.clientX <= rect.right);
                if (!isInDialog) dialog.close();
            });
            dialog.addEventListener('close', unlockPageScrollIfNeeded);
            dialog.addEventListener('cancel', () => setTimeout(unlockPageScrollIfNeeded, 0));
        });
    }

    function init() {
        window.addEventListener('resize', syncAppVh, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(syncAppVh, 250), { passive: true });
        syncAppVh();
        bindDialogDismissHandlers();
    }

    return { init, openDialog, showModal, closeModal };
}

</script>
<script data-source="js/controllers/tabs.js">
// Day tab routing and tabpanel controller.

function createDayTabsController({ getCurrentDay, setCurrentDay, ensureDayContent }) {
    const DAYS_PER_MOBILE_PAGE = 4;

    function getPageIndexForDay(day) {
        return Math.max(0, Math.ceil(day / DAYS_PER_MOBILE_PAGE) - 1);
    }

    function getMobilePageCount() {
        return Math.max(1, Math.ceil(itineraryData.length / DAYS_PER_MOBILE_PAGE));
    }

    function initTabs() {
        const container = document.getElementById('tabs-container');
        if (!container) return;
        container.innerHTML = '';
        container.setAttribute('role', 'tablist');
        container.setAttribute('aria-label', '每日行程切換');

        const pageCount = getMobilePageCount();
        for (let pageIndex = 0; pageIndex < pageCount; pageIndex += 1) {
            const page = document.createElement('div');
            page.className = 'day-tabs-page';
            page.dataset.dayPage = String(pageIndex);
            page.setAttribute('aria-label', `Day ${pageIndex * DAYS_PER_MOBILE_PAGE + 1} 到 Day ${Math.min((pageIndex + 1) * DAYS_PER_MOBILE_PAGE, itineraryData.length)}`);
            itineraryData
                .slice(pageIndex * DAYS_PER_MOBILE_PAGE, (pageIndex + 1) * DAYS_PER_MOBILE_PAGE)
                .forEach((data) => {
                    const btn = document.createElement('button');
                    btn.id = `tab-btn-${data.day}`;
                    btn.type = 'button';
                    btn.setAttribute('role', 'tab');
                    btn.setAttribute('aria-controls', `day-content-${data.day}`);
                    btn.textContent = `Day ${data.day}`;
                    btn.onclick = () => selectDay(data.day);
                    page.appendChild(btn);
                });
            container.appendChild(page);
        }

        container.addEventListener('scroll', () => {
            if (window.innerWidth < 768) updateMobileDotsFromScroll();
        }, { passive: true });

        updateTabsUI({ instantScroll: true });
    }

    function updateMobileDots(activePage = getPageIndexForDay(getCurrentDay())) {
        const dots = document.querySelectorAll('#day-tabs-dots .day-tabs-dot');
        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === activePage);
        });
    }

    function updateMobileDotsFromScroll() {
        const container = document.getElementById('tabs-container');
        if (!container) return;
        const width = container.clientWidth || 1;
        const activePage = Math.round(container.scrollLeft / width);
        updateMobileDots(activePage);
    }

    function scrollActiveMobilePage({ instant = false } = {}) {
        const container = document.getElementById('tabs-container');
        if (!container || window.innerWidth >= 768) return;
        const pageIndex = getPageIndexForDay(getCurrentDay());
        const left = pageIndex * container.clientWidth;
        if (typeof container.scrollTo === 'function') {
            container.scrollTo({ left, behavior: instant ? 'auto' : 'smooth' });
        } else {
            container.scrollLeft = left;
        }
        updateMobileDots(pageIndex);
    }

    function updateTabsUI(options = {}) {
        const currentDay = getCurrentDay();
        itineraryData.forEach((data) => {
            const btn = document.getElementById(`tab-btn-${data.day}`);
            if (!btn) return;
            const isActive = data.day === currentDay;
            btn.className = `flex-shrink-0 px-5 py-3 md:py-2.5 rounded-full font-bold text-sm transition-all duration-300 ${isActive ? 'tab-active' : 'tab-inactive hover:bg-kawaii-light-pink hover:text-white hover:border-kawaii-light-pink'}`;
            btn.setAttribute('aria-selected', String(isActive));
            btn.setAttribute('tabindex', isActive ? '0' : '-1');
        });
        requestAnimationFrame(() => scrollActiveMobilePage({ instant: Boolean(options.instantScroll) }));
    }

    function switchDayContent(day) {
        ensureDayContent(day);
        itineraryData.forEach(data => {
            const el = document.getElementById(`day-content-${data.day}`);
            if (el) {
                if (data.day === day) {
                    el.classList.remove('hidden');
                    el.classList.add('block', 'fade-in');
                    el.setAttribute('aria-hidden', 'false');
                } else {
                    el.classList.add('hidden');
                    el.classList.remove('block', 'fade-in');
                    el.setAttribute('aria-hidden', 'true');
                }
            }
        });
    }

    function selectDay(day) {
        setCurrentDay(day);
        window.history.pushState(null, '', `#day${day}`);
        updateTabsUI();
        switchDayContent(day);
        if(window.innerWidth < 768) {
            const content = document.getElementById('itinerary-content');
            if (content) {
                const contentTop = content.getBoundingClientRect().top + window.scrollY;
                window.scrollTo({ top: contentTop - 80, behavior: 'smooth' });
            }
        }
    }

    function handlePopstate() {
        const hash = window.location.hash;
        let day = 1;
        if (hash && hash.startsWith('#day')) {
            const parsedDay = parseInt(hash.replace('#day', ''));
            if (!isNaN(parsedDay) && itineraryData.some(d => d.day === parsedDay)) day = parsedDay;
        }
        setCurrentDay(day);
        updateTabsUI();
        switchDayContent(day);
    }

    function init() {
        initTabs();
        window.addEventListener('popstate', handlePopstate);
        window.addEventListener('resize', () => scrollActiveMobilePage({ instant: true }), { passive: true });
    }

    return { init, selectDay, switchDayContent, updateTabsUI };
}

</script>
<script data-source="js/controllers/backup-modal.js">
// Backup modal region/category state controller.

function createBackupModalController() {
    let currentBackupRegion = 'oita';
    let currentBackupCategory = 'sight';

    function render() {
        const container = document.getElementById('backup-list-container');
        renderBackupList(container, currentBackupRegion, currentBackupCategory);
        if (container) container.scrollTop = 0;
    }

    function syncCategoryTabs() {
        const categoryTabs = document.getElementById('backup-category-tabs');
        if (!categoryTabs) return;
        categoryTabs.querySelectorAll('button').forEach(b => {
            const active = b.dataset.cat === currentBackupCategory;
            b.classList.toggle('is-active', active);
            b.setAttribute('aria-selected', active ? 'true' : 'false');
        });
    }

    function setBackupRegion(region) {
        currentBackupRegion = region;
        ['oita', 'kumamoto'].forEach(r => {
            const btn = document.getElementById(`btn-region-${r}`);
            if(btn) {
                const active = r === region;
                btn.classList.toggle('is-active', active);
                btn.setAttribute('aria-pressed', active ? 'true' : 'false');
            }
        });
        syncCategoryTabs();
        render();
    }

    function setBackupCategory(category) {
        currentBackupCategory = category;
        syncCategoryTabs();
        render();
    }

    function bindCategoryTabs() {
        const categoryTabs = document.getElementById('backup-category-tabs');
        if (!categoryTabs) return;
        categoryTabs.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn || !btn.dataset.cat) return;
            setBackupCategory(btn.dataset.cat);
        });
    }

    function initBackupModal() {
        setBackupRegion(currentBackupRegion || 'oita');
        setBackupCategory(currentBackupCategory || 'sight');
    }

    function init() {
        bindCategoryTabs();
        syncCategoryTabs();
    }

    return { init, initBackupModal, setBackupRegion, setBackupCategory };
}

</script>
<script data-source="js/controllers/clipboard.js">
// Daily itinerary clipboard controller.

function createDailyItineraryClipboardController({ getCurrentDay }) {
    async function copyDailyItinerary() {
        const data = itineraryData.find(d => d.day === getCurrentDay());
        if(!data) return;

        let textToCopy = `🚗 九州大冒險 - Day ${data.day} (${htmlToPlainText(data.date)})\n📌 主題：${htmlToPlainText(data.title)}\n🗺️ 動線：${htmlToPlainText(data.route)}\n🏨 住宿：${htmlToPlainText(data.hotel)}\n\n`;
        data.sections.forEach(sec => {
            textToCopy += `【${htmlToPlainText(sec.title)}】${sec.time ? ` (${htmlToPlainText(sec.time)})` : ''}\n${htmlToPlainText(sec.content)}\n`;
            if(sec.deepTip) textToCopy += `💡 筆記：${htmlToPlainText(sec.deepTip)}\n`;
            textToCopy += `\n`;
        });
        if(data.tips) textToCopy += `⚠️ 注意事項：${htmlToPlainText(data.tips)}\n\n`;

        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(textToCopy);
                alert(`✅ Day ${data.day} 行程與實戰攻略已複製！`);
            } else throw new Error('Clipboard API restricted');
        } catch (err) {
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            textArea.style.position = "fixed"; textArea.style.top = "0"; textArea.style.left = "0";
            document.body.appendChild(textArea);
            textArea.focus(); textArea.select();
            try { document.execCommand('copy'); alert(`✅ Day ${data.day} 行程與實戰攻略已複製！`); }
            catch (fallbackErr) { alert('❌ 複製失敗，請手動選取複製。'); }
            document.body.removeChild(textArea);
        }
    }

    return { copyDailyItinerary };
}

</script>
<script data-source="js/main.js">
// 九州親子大冒險 - app bootstrap and controller wiring.

(() => {
    let currentDay = getInitialDayFromHash();

    function getInitialDayFromHash() {
        const hash = window.location.hash;
        if (hash && hash.startsWith('#day')) {
            const parsedDay = parseInt(hash.replace('#day', ''));
            if (!isNaN(parsedDay) && itineraryData.some(d => d.day === parsedDay)) {
                return parsedDay;
            }
        }
        return 1;
    }

    function getCurrentDay() {
        return currentDay;
    }

    function setCurrentDay(day) {
        currentDay = day;
    }

    function ensureDayContent(day) {
        const container = document.getElementById('itinerary-content');
        let el = document.getElementById(`day-content-${day}`);
        if (!el) {
            const data = itineraryData.find(d => d.day === day);
            if (!data || !container) return null;
            el = renderDayContent(data, currentDay);
            container.appendChild(el);
        }
        return el;
    }

    function buildInitialDayContent() {
        const container = document.getElementById('itinerary-content');
        if (!container) return;
        container.innerHTML = '';
        ensureDayContent(currentDay);
    }

    const dialogsRoot = document.getElementById('dialogs-root');
    if (dialogsRoot && !dialogsRoot.innerHTML) {
        dialogsRoot.innerHTML = renderStaticModals();
    }

    const modalController = createModalController();
    const tabsController = createDayTabsController({ getCurrentDay, setCurrentDay, ensureDayContent });
    const backupModalController = createBackupModalController();
    const clipboardController = createDailyItineraryClipboardController({ getCurrentDay });

    window.showModal = modalController.showModal;
    window.closeModal = modalController.closeModal;
    window.selectDay = tabsController.selectDay;
    window.initBackupModal = backupModalController.initBackupModal;
    window.setBackupRegion = backupModalController.setBackupRegion;
    window.copyDailyItinerary = clipboardController.copyDailyItinerary;
    window.openDayInfo = (day, mode) => openDayInfoModal(day, mode, modalController.openDialog);
    window.preparePrintView = function() {
        const container = document.getElementById('print-container');
        if (!container) return false;
        container.innerHTML = renderPrintViewHtml();
        container.dataset.printReady = 'true';
        return true;
    };

    // The printed paper manual is a fixed, already-typeset A4 PDF.
    // Do not route the toolbar button through the browser's HTML print layout: that
    // can reflow the interactive web cards and produce a different paper experience.
    window.getPaperGuidePdfUrl = function(anchorHref) {
        if (anchorHref) return anchorHref;

        const currentPath = window.location.pathname || '';
        const fileName = 'kyushu-travel-manual.pdf';

        // Works for the root index.html / kyushu-trip-final-day6-day8.html because
        // a root copy of the PDF is committed. It also works for dist/kyushu-trip-final.html
        // because dist already contains the same PDF beside the single-file build.
        if (/\/dist\//.test(currentPath)) {
            return new URL(fileName, window.location.href).href;
        }

        return new URL(fileName, window.location.href).href;
    };

    window.openPaperGuidePdf = function(event) {
        if (event && typeof event.preventDefault === 'function') {
            event.preventDefault();
        }

        const anchor = event && event.currentTarget ? event.currentTarget : null;
        const pdfUrl = window.getPaperGuidePdfUrl(anchor && anchor.href);
        const opened = window.open(pdfUrl, '_blank', 'noopener,noreferrer');

        if (!opened) {
            window.location.href = pdfUrl;
        }

        return false;
    };

    // Backward-compatible name for any existing inline handlers.
    // It intentionally opens the official PDF instead of printing the HTML app.
    window.printPaperGuide = function() {
        const pdfUrl = window.getPaperGuidePdfUrl();
        const opened = window.open(pdfUrl, '_blank', 'noopener,noreferrer');

        if (!opened) {
            window.location.href = pdfUrl;
        }
    };

    // Developer-only fallback: generate the HTML manual and call window.print().
    // Keep this separate so the user-facing toolbar never triggers the reflowed web layout.
    window.printGeneratedPaperGuide = async function() {
        if (!window.preparePrintView()) return;
        if (document.fonts && document.fonts.ready) {
            try {
                await document.fonts.ready;
            } catch (error) {
                // Font readiness is an enhancement only; print should still proceed.
            }
        }
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        window.print();
    };
    window.printPaperGuideFallback = window.printGeneratedPaperGuide;

    modalController.init();
    backupModalController.init();
    tabsController.init();
    buildInitialDayContent();
    window.addEventListener('beforeprint', window.preparePrintView);
})();

</script>
</body>
</html>
