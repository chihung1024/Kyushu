<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>九州親子大冒險 🚗💨 (O型環線・每日路線與備選方案)</title>

<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&amp;family=Noto+Sans+TC:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
</head>
<body class="text-gray-900 font-sans antialiased pb-24 print:pb-0 print:bg-white">

<div class="print:hidden">

<header class="site-hero bg-gradient-to-r from-kawaii-pink to-pink-400 text-white rounded-b-[2.5rem] shadow-kawaii p-6 relative z-30">
<div class="site-hero-inner max-w-4xl mx-auto flex justify-between items-center md:px-6 lg:px-12">
<div class="site-hero-copy">
<h1 class="text-2xl md:text-3xl font-black tracking-wider drop-shadow-md">九州親子大冒險 🧭✨</h1>
<p class="text-xs md:text-sm mt-1 opacity-90 font-bold bg-white/20 inline-block px-3 py-1 rounded-full">雙家庭(2大2小) 每日路線・備選方案</p>
</div>
<nav class="desktop-hero-actions" aria-label="桌機版主要工具">
<button class="desktop-hero-action desktop-hero-action-primary" type="button" onclick="initBackupModal(); showModal('backupModal');">
<span>🗺️</span><strong>現場決策庫</strong><small>景點・吃飯・補給</small>
</button>
<button class="desktop-hero-action" type="button" onclick="showModal('mobileMoreModal')">
<span>☰</span><strong>其他工具</strong><small>行前・紙本・複製</small>
</button>
</nav>
</div>
</header>

<main class="max-w-4xl mx-auto px-4 mt-6">

<section class="mobile-command-bar" aria-label="手機版快速工具">
<button class="mobile-command-btn mobile-command-primary" type="button" onclick="initBackupModal(); showModal('backupModal');">
<span class="mobile-command-icon">🗺️</span>
<span><strong>現場決策庫</strong><small>景點・吃飯・補給</small></span>
</button>
<button class="mobile-command-btn" type="button" onclick="showModal('mobileMoreModal')">
<span class="mobile-command-icon">☰</span>
<span><strong>其他</strong><small>行前・紙本・複製</small></span>
</button>
</section>

<div class="day-tabs-shell sticky top-0 z-40 bg-kawaii-bg/95 backdrop-blur-md pt-1 pb-2 -mx-4 px-4 md:mx-0 md:px-0 border-b-2 border-kawaii-light-pink/50 mb-4 transition-all shadow-sm">
<div class="flex overflow-x-auto md:overflow-visible hide-scrollbar space-x-3 md:justify-center py-3 px-2" id="tabs-container">

</div>
<div class="day-tabs-dots" id="day-tabs-dots" aria-hidden="true">
<span class="day-tabs-dot active"></span>
<span class="day-tabs-dot"></span>
</div>
</div>

<div class="bg-white rounded-[2rem] p-4 sm:p-6 md:py-8 md:px-12 lg:px-16 shadow-kawaii border-4 border-white mb-6" id="itinerary-content">

</div>
</main>


<div id="dialogs-root"></div>
</div>

<div class="hidden print:block w-full max-w-4xl mx-auto bg-white text-black p-4" id="print-container"></div>

<script src="js/utils/html.js"></script>
<script src="js/data/constants.js"></script>

<script src="js/data/backup.js"></script>
<script src="js/data/gourmet-backup.js"></script>
<script src="js/data/day-focus.js"></script>

<script src="js/components/print-view.js"></script>
<script src="js/components/static-modals.js"></script>
<script src="js/controllers/modal.js"></script>
<script src="js/controllers/tabs.js"></script>

<script src="js/controllers/clipboard.js"></script>
<script src="js/main.js"></script>

</html>
