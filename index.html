<div>

<p class="text-xs md:text-sm mt-1 opacity-90 font-bold bg-white/20 inline-block px-3 py-1 rounded-full">雙家庭(2大2小) 每日路線・備選方案</p>
</div>
<div class="text-3xl animate-bounce drop-shadow-lg cursor-pointer" onclick="alert('行程資訊已準備就緒，預祝旅途愉快！')">
                    🐻

</div>

<div>
<div class="text-[10px] text-amber-700 font-bold bg-white px-2 py-0.5 rounded-full inline-block shadow-sm mb-0.5">出發前必看</div>
<div class="text-xs md:text-sm font-black text-amber-900 leading-tight">VJW＋旅遊醫療保險教學</div>
</div>
</div>
<div class="w-[70vw] sm:w-[260px] md:w-auto snap-start shrink-0 bg-gradient-to-br from-rose-50 to-orange-50 rounded-xl p-4 text-left shadow-sm border-2 border-rose-300 cursor-pointer transition-all hover:scale-105 hover:shadow-md flex items-center gap-3" onclick="showModal('preDepartureModal')">

</div>
</div>
<div class="w-[70vw] sm:w-[260px] md:w-auto snap-start shrink-0 bg-gradient-to-br from-purple-50 to-purple-100 rounded-xl p-4 text-left shadow-sm border-2 border-purple-300 cursor-pointer transition-all hover:scale-105 hover:shadow-md flex items-center gap-3" onclick="showModal('hotelModal')">
<div class="text-2xl relative shrink-0">
                        🏨
                        <span class="absolute -top-1 -right-1 flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
</span>

</div>
</div>
<div class="w-[70vw] sm:w-[260px] md:w-auto snap-start shrink-0 bg-white rounded-xl p-4 text-left shadow-sm border-2 border-kawaii-light-blue cursor-pointer transition-all hover:scale-105 hover:shadow-md flex items-center gap-3" onclick="showModal('budgetModal')">
<div class="text-2xl shrink-0">💰</div>
<div>
<div class="text-[10px] text-gray-500 font-bold mb-0.5">單一家庭實際預算</div>

</div>
</div>

<div class="text-2xl shrink-0 animate-pulse drop-shadow">🗺️</div>
<div>
<div class="text-[10px] text-cyan-600 font-bold bg-white px-2 py-0.5 rounded-full inline-block shadow-sm mb-0.5">全九州 180 選</div>

</div>
</div>

<div class="flex overflow-x-auto md:overflow-visible hide-scrollbar space-x-3 md:justify-center py-3 px-2" id="tabs-container">

</div>
</div>

<div class="flex justify-end gap-2 mb-4 pr-2">
<button class="text-xs bg-gray-200 text-gray-800 font-bold px-4 py-3 md:py-2 rounded-full shadow-sm hover:bg-gray-300 transition flex items-center gap-1.5 min-w-[44px]" onclick="window.preparePrintView &amp;&amp; window.preparePrintView(); setTimeout(() =&gt; window.print(), 50)">
<span class="text-sm">🖨️</span> 列印紙本攻略
                </button>
<button class="text-xs bg-gray-800 text-white px-4 py-3 md:py-2 rounded-full shadow-md hover:bg-gray-700 transition flex items-center gap-2 min-w-[44px]" onclick="copyDailyItinerary()">
<span>📋</span> 複製今日行程給伴侶
                </button>
</div>

<div class="bg-white rounded-[2rem] p-4 sm:p-6 md:py-8 md:px-12 lg:px-16 shadow-kawaii border-4 border-white mb-6" id="itinerary-content">
